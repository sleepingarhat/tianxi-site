<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<script src="/assets/theme.js"></script>
  <script src="/assets/shell.js" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDFBF5">
<title>排位表 · 天喜 TIANXI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/shell.css">
<script src="/assets/api.js"></script>
<style>
.sub-bar{position:sticky;top:60px;z-index:40;background:var(--paper);border-bottom:1px solid var(--rule);padding:10px 16px;display:flex;align-items:center;gap:10px}
.sub-bar a.back{color:var(--ink);font-size:18px;font-weight:700;text-decoration:none;padding:4px 8px;margin-left:-8px}
.sub-bar h1{font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--ink)}

.chip-row{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--paper)}
.chip-row::-webkit-scrollbar{height:0}
.chip{flex-shrink:0;min-width:44px;padding:7px 12px;border-radius:999px;background:var(--paper-2);border:1px solid var(--rule);color:var(--ink-soft);font-family:var(--font-mono);font-weight:700;font-size:12px;text-align:center;text-decoration:none;transition:all 120ms}
.chip:hover{border-color:var(--rule-2)}
.chip.is-active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.meta-line{padding:12px 16px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--ink-soft);line-height:1.65;font-family:var(--font-body)}
.meta-line b{color:var(--ink);font-weight:700}
.meta-line .sep{color:var(--ink-faint);margin:0 6px}

.entries-table{width:100%;border-collapse:collapse;font-size:13px}
.entries-table thead th{background:var(--paper-2);color:var(--ink-mute);font-weight:600;font-size:10px;letter-spacing:.08em;padding:8px 6px;text-align:left;border-bottom:1px solid var(--rule-2);position:sticky;top:130px;z-index:20}
.entries-table thead th.col-odds{text-align:right}
.entries-table thead th.col-draw,
.entries-table thead th.col-weight{text-align:center}
.entries-table tbody tr{border-bottom:1px solid var(--rule);cursor:pointer;transition:background 120ms}
.entries-table tbody tr:hover{background:var(--paper-2)}
.entries-table tbody tr:active{background:var(--paper-3)}
.entries-table td{padding:10px 6px;vertical-align:middle}
.col-no{width:32px;text-align:center;font-family:var(--font-mono);font-weight:800;color:var(--ink);font-size:14px}
.col-silks{width:40px;text-align:center}
.silks-img{width:32px;height:32px;object-fit:contain;border:1px solid var(--rule);border-radius:4px;background:var(--paper-2)}
.col-name{min-width:0}
.col-name .n-ch{font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:14px;line-height:1.2}
 .col-name .n-ch a{color:inherit;text-decoration:none}
.col-name .n-jt{margin-top:2px;font-size:11px;color:var(--ink-mute);line-height:1.3}
.col-name .n-jt b{color:var(--ink-soft);font-weight:500}
.col-odds{width:62px;text-align:right;font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--ink);padding-right:10px!important}
.col-odds.is-fav{color:var(--red)}
.col-draw{width:32px;text-align:center;font-family:var(--font-mono);color:var(--ink-soft);font-weight:600}
.col-weight{width:46px;text-align:center;font-family:var(--font-mono);color:var(--ink-soft);font-weight:600;font-size:12px}
.col-chev{width:16px;color:var(--ink-faint);text-align:right;padding-right:12px!important}

.empty{padding:40px 16px;text-align:center;color:var(--ink-mute);font-size:13px}
.err{padding:20px;color:var(--red);font-size:12px;text-align:center}

.disclaimer-strip{padding:12px 16px;background:var(--paper-2);border-top:1px solid var(--rule);color:var(--ink-mute);font-size:11px;line-height:1.5}
.disclaimer-strip strong{color:var(--ink-soft)}
</style>
</head>
<body data-page="race">
<div class="shell">

<header class="brandbar" data-tx-shell="brandbar"></header>

<div class="sub-bar">
  <a href="/" class="back" aria-label="返回">‹</a>
  <h1>排位表</h1>
</div>

<nav class="chip-row" id="chip-row" aria-label="場次快捷"></nav>

<div class="meta-line" id="meta-line"><span data-tx-loader data-size="sm" data-label="載入中…"></span></div>

<table class="entries-table" id="entries-table" aria-label="馬匹排位">
  <thead>
    <tr>
      <th class="col-silks">綵</th>
      <th class="col-no">號</th>
      <th class="col-name">馬名</th>
      <th class="col-odds">獨贏</th>
      <th class="col-draw">檔</th>
      <th class="col-weight">負磅</th>
      <th class="col-chev"></th>
    </tr>
  </thead>
  <tbody id="entries-body">
    <tr><td colspan="7"><div class="tx-lemni-host" data-tx-loader data-label="載入排位…"></div></td></tr>
  </tbody>
</table>

<div class="disclaimer-strip">
  <strong>資訊展示：</strong>以上獨贏賠率、馬匹資料供分析參考，非投注建議。天喜為分析平台，不提供投注服務。
</div>

<nav class="botnav" data-tx-shell="botnav"></nav>

</div>

<script>
(function(){
  var VENUE_MAP = { HV: '跑馬地', ST: '沙田' };

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  }); }

  function qs(name){
    var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  function buildRaceId(){
    var rid = TX_API.canonicalRaceId(qs('raceId'));
    if (rid) return rid;
    var date = qs('date'), r = qs('r'), venue = qs('venue');
    if (date && /^\d+$/.test(String(r || '')) && /^(ST|HV)$/.test(String(venue || ''))) {
      return TX_API.canonicalRaceId('race_' + date + '_' + venue + '_' + r);
    }
    return null;
  }

  function findFavourite(entries){
    var min = Infinity, idx = -1;
    entries.forEach(function(e, i){
      var w = parseFloat(e.winOdds || e.win_odds);
      if (!isNaN(w) && w > 0 && w < min){ min = w; idx = i; }
    });
    return idx;
  }

  function renderChipRow(meetingRaces, currentRaceId){
    var row = document.getElementById('chip-row');
    row.innerHTML = '';
    if (!meetingRaces || !meetingRaces.length) return;
    meetingRaces.forEach(function(r){
      var rid = r.id || r.raceId;
      var a = document.createElement('a');
      a.className = 'chip' + (rid === currentRaceId ? ' is-active' : '');
      a.href = '/race/?raceId=' + encodeURIComponent(rid);
      a.textContent = r.raceNumber || r.race_no;
      row.appendChild(a);
    });
  }

  function renderMeta(race, meeting){
    var parts = [];
    var dt = race.date || (meeting && meeting.date);
    if (dt) parts.push('<b>' + esc(TX_API.fmtMeetingDate(dt) || dt) + '</b>');
    var st = TX_API.cleanTime(race.startTime || race.start_time);
    if (st) parts.push('<b>' + esc(st) + '</b>');
    var venueName = race.venueName || VENUE_MAP[race.venue || (meeting && meeting.venue)] || race.venue || '';
    if (venueName) parts.push(esc(venueName));
    var cls = race.className || race.class_name || race.class;
    if (cls) parts.push(esc(cls));
    var dist = race.distanceM || race.distance_m || race.distance;
    if (dist) parts.push(esc(dist) + '米');
    var going = race.going || race.trackCondition;
    if (going) parts.push(esc(going));
    var handicap = race.handicapType || race.handicap_type;
    if (handicap) parts.push(esc(handicap));
    document.getElementById('meta-line').innerHTML = parts.join('<span class="sep">·</span>');
  }

  var STYLE_MAP = {};
  function renderEntries(entries){
    var body = document.getElementById('entries-body');
    body.innerHTML = '';
    if (!entries || !entries.length){
      body.innerHTML = '<tr><td colspan="7" class="empty">尚未公布排位</td></tr>';
      return;
    }
    var favIdx = findFavourite(entries);
    entries.forEach(function(e, i){
      var tr = document.createElement('tr');
      tr.tabIndex = 0;
      var no = e.horseNumber || e.horse_no || e.no || '';
      var nameCh = e.nameCh || e.name_ch || e.name || '';
      var jockey = e.jockey || e.jockey_name || '';
      var trainer = e.trainer || e.trainer_name || '';
      var odds = e.winOdds != null ? e.winOdds : (e.win_odds != null ? e.win_odds : '');
      var draw = e.draw != null ? e.draw : '';
      var weight = e.weight != null ? e.weight : (e.carry_weight != null ? e.carry_weight : '');
      var horseId = TX_API.canonicalHorseId(e.horseId || e.horse_id || e.id);
      var silksCode = e.silksCode || e.silks_code || '';
      var silks = silksCode ? '<img class="silks-img" loading="lazy" alt="綵衣" src="' + esc(TX_API.silksUrl(silksCode)) + '">' : '';
      tr.innerHTML =
        '<td class="col-silks">' + silks + '</td>' +
        '<td class="col-no">' + esc(no) + '</td>' +
        '<td class="col-name">' +
           '<div class="n-ch">' + (TX_API.horseHref(horseId, CURRENT_RACE_ID) ? '<a href="' + TX_API.horseHref(horseId, CURRENT_RACE_ID) + '">' + esc(nameCh) + (STYLE_MAP[horseId] ? TX_API.runningStyleBadge(STYLE_MAP[horseId]) : '') + '</a>' : esc(nameCh)) + '</div>' +
          '<div class="n-jt">' +
            (jockey ? '<b>騎</b> ' + esc(jockey) : '') +
            (trainer ? ' <b>練</b> ' + esc(trainer) : '') +
          '</div>' +
        '</td>' +
        '<td class="col-odds' + (i === favIdx ? ' is-fav' : '') + '">' + esc(odds) + '</td>' +
        '<td class="col-draw">' + esc(draw) + '</td>' +
        '<td class="col-weight">' + esc(weight) + '</td>' +
        '<td class="col-chev">›</td>';
      if (horseId) {
        tr.addEventListener('click', function(){
          location.href = TX_API.horseHref(horseId, CURRENT_RACE_ID);
        });
      } else {
        tr.removeAttribute('tabindex');
      }
      body.appendChild(tr);
    });
  }

  var CURRENT_RACE_ID = buildRaceId();

  function boot(){
    if (!CURRENT_RACE_ID){
      document.getElementById('meta-line').textContent = '缺少 raceId 參數';
      document.getElementById('entries-body').innerHTML = '<tr><td colspan="7" class="err">URL 缺少標準 raceId（或 date+r+venue）參數</td></tr>';
      return;
    }

    // Prefer the enriched /api/races/:id/entries endpoint; fallback to /api/races/:id + topPicks merge.
    var primary = (TX_API.raceEntries
        ? TX_API.raceEntries(CURRENT_RACE_ID).catch(function(){ return TX_API.race(CURRENT_RACE_ID); })
        : TX_API.race(CURRENT_RACE_ID));

    primary.then(function(data){
      var race = data.race || data;
      var entries = data.entries || race.entries || [];
      var siblings = data.meetingRaces || data.siblings || (data.meeting && data.meeting.races) || [];
      var meeting = data.meeting || null;

      renderChipRow(siblings, CURRENT_RACE_ID);
      renderMeta(race, meeting);
      var ids = entries.map(function(e){ return e.horseId || e.horse_id || e.id; });
      TX_API.runningStyles(ids, { raceId: CURRENT_RACE_ID }).then(function(sd){
        STYLE_MAP = {}; (sd.styles || []).forEach(function(x){ STYLE_MAP[x.horseId] = x; }); renderEntries(entries);
      });
    }).catch(function(e){
      document.getElementById('meta-line').textContent = '載入失敗';
      document.getElementById('entries-body').innerHTML =
        '<tr><td colspan="7" class="err">' + esc(e && e.message ? e.message : '網絡錯誤') + '</td></tr>';
    });
  }

  boot();
})();
</script>
</body>
</html>
