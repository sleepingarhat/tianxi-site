<!DOCTYPE html>
  <html lang="zh-HK">
  <head>
  <meta charset="utf-8">
  <script src="/assets/theme.js"></script>
  <script src="/assets/shell.js" defer></script>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FDFBF5">
  <title>預測與賽果 · 天喜 TIANXI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/shell.css">
  <script src="/assets/api.js"></script>
  <style>
  .cmp-head{padding:22px 20px 8px}
  .cmp-head h1{font-family:var(--font-display);font-weight:900;font-size:24px;color:var(--ink);letter-spacing:-0.005em;line-height:1.15}
  .cmp-head h1 small{display:block;font-family:var(--font-body);font-size:10px;color:var(--ink-mute);letter-spacing:0.22em;text-transform:uppercase;margin-bottom:6px;font-weight:700}
  .cmp-head p{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.55}

  .cmp-pickers{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 20px 14px;border-bottom:1px solid var(--rule)}
  .cmp-pickers label{display:block;font-size:10px;color:var(--ink-mute);letter-spacing:0.12em;font-weight:700;text-transform:uppercase;margin-bottom:6px}
  .cmp-pickers select{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper-2);color:var(--ink);font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer}
  .cmp-pickers select:focus{outline:0;border-color:var(--ink)}

  .cmp-meta{padding:10px 20px;font-family:var(--font-mono);font-size:11px;color:var(--ink-mute);letter-spacing:0.06em;border-bottom:1px solid var(--rule);min-height:18px}
  .cmp-meta b{color:var(--ink);font-weight:700}

  .cmp-wrap{padding:16px 16px 22px}
  .cmp-square{aspect-ratio:1/1;width:100%;max-width:560px;margin:0 auto;border:1px solid var(--rule);border-radius:14px;overflow:hidden;background:var(--paper);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 1px 0 rgba(58,38,8,.08),0 4px 10px rgba(58,38,8,.08),0 18px 36px -16px rgba(90,66,16,.16)}
  .cmp-col-hdr{padding:10px 12px;font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;background:var(--paper-2);border-bottom:1px solid var(--rule);text-align:center}
  .cmp-col-hdr.l{border-right:1px solid var(--rule);color:var(--ink)}
  .cmp-col-hdr.r{color:var(--ink)}
  .cmp-col-hdr small{display:block;font-family:var(--font-mono);font-weight:600;font-size:9px;color:var(--ink-mute);letter-spacing:0.18em;margin-top:2px}

  .cmp-list{display:flex;flex-direction:column;min-width:0}
  .cmp-list.l{border-right:1px solid var(--rule)}
  .cmp-cell{flex:1 1 0;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule);min-height:0;transition:background 150ms ease}
  .cmp-cell:last-child{border-bottom:0}
  .cmp-rank{font-family:var(--font-display);font-weight:900;font-size:18px;color:var(--ink-mute);text-align:center;line-height:1}
  .cmp-rank.r1{color:#D4A93C}
  .cmp-rank.r2{color:#8F8268}
  .cmp-rank.r3{color:#A07A1F}
  .cmp-no-name{min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.15}
  .cmp-no{font-family:var(--font-mono);font-weight:800;font-size:11px;color:var(--ink-mute);letter-spacing:0.04em}
  .cmp-name{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmp-draw{font-family:var(--font-mono);font-weight:700;font-size:11px;color:var(--ink-soft);background:var(--paper-2);padding:3px 7px;border-radius:6px;border:1px solid var(--rule);white-space:nowrap}
  .cmp-draw small{font-weight:500;color:var(--ink-mute);margin-right:2px}

  /* yellow highlight for horses present on BOTH sides */
  .cmp-cell.match{background:linear-gradient(180deg,#FFF4C2 0%,#F6E08C 100%);border-color:#D4A93C}
  .cmp-cell.match .cmp-no{color:#5A4210}
  .cmp-cell.match .cmp-name{color:#2E2108}
  .cmp-cell.match .cmp-draw{background:rgba(255,255,255,.55);border-color:#D4A93C;color:#5A4210}
  .cmp-cell.match .cmp-draw small{color:#7A5A20}

  /* Non-color cue for matched cells (accessibility) */
  .cmp-cell.match .cmp-name::before{content:"✓ ";color:#7A5A20;font-weight:900}

  /* Narrow viewport: relax 1:1 + tighten layout */
  @media (max-width: 360px){
    .cmp-square{aspect-ratio:auto;min-height:380px}
    .cmp-cell{padding:8px 8px;gap:6px;grid-template-columns:22px 1fr auto}
    .cmp-name{font-size:12px}
    .cmp-rank{font-size:16px}
    .cmp-draw{padding:2px 5px;font-size:10px}
  }

  .cmp-empty{padding:24px 16px;color:var(--ink-mute);font-size:12px;text-align:center;line-height:1.5}
  .cmp-empty strong{display:block;color:var(--ink-soft);font-size:13px;margin-bottom:4px}

  .cmp-legend{max-width:560px;margin:12px auto 0;font-size:11px;color:var(--ink-mute);line-height:1.55;text-align:center;padding:0 8px}
  .cmp-legend .swatch{display:inline-block;width:14px;height:10px;background:linear-gradient(180deg,#FFF4C2,#F6E08C);border:1px solid #D4A93C;border-radius:2px;vertical-align:-1px;margin-right:4px}
  </style>
  </head>
  <body data-page="home">
  <div class="shell">

  <header class="brandbar" data-tx-shell="brandbar"></header>

  <section class="cmp-head">
    <h1><small>PREDICTION vs RESULT</small>預測與賽果</h1>
    <p>揀賽事日期同場次，比對天喜預測首 4 名同實際賽果首 4 名。左右兩邊同時出現嘅馬匹會用<b style="color:#A07A1F">金黃底</b>標記。</p>
  </section>

  <section class="cmp-pickers">
    <div>
      <label for="cmp-date">賽事日期</label>
      <select id="cmp-date"><option>載入中…</option></select>
    </div>
    <div>
      <label for="cmp-race">場次</label>
      <select id="cmp-race" disabled><option>請先揀日期</option></select>
    </div>
  </section>

  <div class="cmp-meta" id="cmp-meta">—</div>

  <div class="cmp-wrap">
    <div class="cmp-square" id="cmp-square">
      <div class="cmp-col-hdr l">預測<small>PREDICTION · TOP 4</small></div>
      <div class="cmp-col-hdr r">賽果<small>RESULT · 1ST – 4TH</small></div>
      <div class="cmp-list l" id="cmp-left" aria-live="polite" aria-label="預測首四名">
        <div class="cmp-empty"><strong>未選擇</strong>請於上方揀選日期同場次</div>
      </div>
      <div class="cmp-list r" id="cmp-right" aria-live="polite" aria-label="賽果首四名">
        <div class="cmp-empty"><strong>未選擇</strong>請於上方揀選日期同場次</div>
      </div>
    </div>
    <p class="cmp-legend"><span class="swatch"></span>同時出現於預測與賽果嘅馬匹</p>
  </div>

  <footer style="margin:18px 20px 24px;padding-top:14px;font-size:11px;color:var(--ink-mute);line-height:1.55;border-top:1px solid var(--rule)">
    <strong>天喜為分析平台，不提供投注服務。</strong>投注請透過合法渠道（HKJC）進行。此處顯示之預測、賽果、馬匹資料純屬分析展示，非投注建議。
  </footer>

  <nav class="botnav" data-tx-shell="botnav"></nav>

  </div>

  <script>
  (function(){
    var VENUE = { HV:'跑馬地', ST:'沙田', S1:'沙田全天候' };
    var BASE = (window.TX_API && TX_API.base) || '';
    var compareToken = 0; // monotonic, latest-wins guard
    var racesToken = 0;
    function $(id){ return document.getElementById(id); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    }); }
    function rankCls(i){ return i===0?'r1':i===1?'r2':i===2?'r3':''; }
    function norm(s){ return String(s==null?'':s).trim().toLowerCase(); }

    function fetchJSON(p){ return fetch(BASE + p, {credentials:'omit'}).then(function(r){
      if (!r.ok) throw new Error('API ' + r.status); return r.json();
    }); }

    function renderEmpty(elId, text){
      $(elId).innerHTML = '<div class="cmp-empty"><strong>' + esc(text||'無資料') + '</strong>—</div>';
    }

    function renderCell(rank, horse, isMatch){
      var no = horse.horseNumber || horse.no || '?';
      var nm = horse.nameCh || horse.name || '—';
      var dr = (horse.draw != null && horse.draw !== '') ? horse.draw : '—';
      return '<div class="cmp-cell' + (isMatch?' match':'') + '">' +
        '<div class="cmp-rank ' + rankCls(rank-1) + '">' + rank + '</div>' +
        '<div class="cmp-no-name">' +
          '<div class="cmp-no">#' + esc(no) + '</div>' +
          '<div class="cmp-name">' + esc(nm) + '</div>' +
        '</div>' +
        '<div class="cmp-draw"><small>檔</small>' + esc(dr) + '</div>' +
      '</div>';
    }

    // Match key: prefer trusted horseId; else require BOTH a horse number AND a name
    // so missing-field items never collide on a synthetic "n:undefined".
    function key(h){
      if (!h) return null;
      if (h.horseId) return 'h:' + h.horseId;
      if (h.id) return 'h:' + h.id;
      var no = h.horseNumber != null ? h.horseNumber : h.no;
      var nm = h.nameCh || h.name;
      if (no != null && no !== '' && nm) return 'no:' + no + '|nm:' + norm(nm);
      return null; // not enough info to match safely
    }

    function render(left, right){
      var L = (left || []).filter(Boolean);
      var R = (right || []).filter(Boolean);
      var leftKeys = {};  L.forEach(function(h){ var k = key(h); if (k) leftKeys[k]  = true; });
      var rightKeys = {}; R.forEach(function(h){ var k = key(h); if (k) rightKeys[k] = true; });

      function isMatch(h, otherSet){ var k = key(h); return !!(k && otherSet[k]); }

      $('cmp-left').innerHTML = L.length
        ? L.slice(0,4).map(function(h,i){ return renderCell(i+1, h, isMatch(h, rightKeys)); }).join('')
        : '<div class="cmp-empty"><strong>未有預測</strong>此場暫未產生天喜預測</div>';

      $('cmp-right').innerHTML = R.length
        ? R.slice(0,4).map(function(h,i){ return renderCell(i+1, h, isMatch(h, leftKeys)); }).join('')
        : '<div class="cmp-empty"><strong>賽果未出</strong>此場暫未完賽或結果未同步</div>';
    }

    function setMeta(text){ $('cmp-meta').innerHTML = text || '—'; }

    // Load meetings list
    function loadMeetings(){
      return fetchJSON('/api/meetings?limit=60').then(function(d){
        var arr = (d && d.meetings) || d || [];
        var sel = $('cmp-date');
        if (!arr.length){ sel.innerHTML = '<option>暫無賽事資料</option>'; sel.disabled = true; return null; }
        sel.innerHTML = arr.map(function(m){
          var v = VENUE[m.venue] || m.venue || '';
          return '<option value="' + esc(m.date) + '">' + esc(m.date) + (v ? ' · ' + esc(v) : '') + '</option>';
        }).join('');
        sel.disabled = false;
        // Pick the most recent date that has results — i.e. the most recent past meeting
        var today = new Date().toISOString().slice(0,10);
        var defaultIdx = 0;
        for (var i = 0; i < arr.length; i++){
          if (arr[i].date <= today){ defaultIdx = i; break; }
        }
        sel.selectedIndex = defaultIdx;
        return arr[defaultIdx];
      });
    }

    function loadRaces(date){
      if (!date){ return Promise.resolve(null); }
      var myToken = ++racesToken;
      return fetchJSON('/api/meetings/' + encodeURIComponent(date)).then(function(m){
        if (myToken !== racesToken) return null; // stale, ignore
        var races = (m && m.races) || [];
        var sel = $('cmp-race');
        if (!races.length){
          sel.innerHTML = '<option>此日無場次</option>'; sel.disabled = true;
          setMeta('<b>' + esc(date) + '</b> · 暫無場次資料');
          render([], []);
          return null;
        }
        sel.disabled = false;
        sel.innerHTML = races.map(function(r){
          var no = r.raceNumber || r.race_no || r.no;
          var t = TX_API.cleanTime(r.startTime || r.start_time) || '——';
          var d = r.distance || r.distance_m || '';
          return '<option value="' + esc(r.id || r.race_id) + '">R' + esc(no) + ' · ' + esc(t) + (d ? ' · ' + esc(d) + 'm' : '') + '</option>';
        }).join('');
        sel.selectedIndex = 0;
        var venue = VENUE[m.venue] || m.venue || '';
        var going = m.trackCondition || m.going || '';
        setMeta('<b>' + esc(date) + '</b>' + (venue ? ' · ' + esc(venue) : '') + (going ? ' · 場地 ' + esc(going) : '') + ' · 共 <b>' + races.length + '</b> 場');
        return { meeting:m, race:races[0] };
      });
    }

    function loadCompare(date, raceId){
      if (!raceId) return;
      var myToken = ++compareToken;
      $('cmp-left').innerHTML  = '<div class="cmp-empty"><strong>載入中…</strong></div>';
      $('cmp-right').innerHTML = '<div class="cmp-empty"><strong>載入中…</strong></div>';
      var pPred = fetchJSON('/api/analyze/top-picks?raceId=' + encodeURIComponent(raceId))
        .then(function(d){ return (d && d.picks) ? d.picks.slice(0,4) : []; })
        .catch(function(){ return []; });
      var pRes = fetchJSON('/api/races/' + encodeURIComponent(raceId))
        .then(function(r){
          var hs = (r && r.horses) || [];
          return hs.filter(function(h){ return h && h.finishingPosition && h.finishingPosition >= 1 && h.finishingPosition <= 4; })
                   .sort(function(a,b){ return a.finishingPosition - b.finishingPosition; });
        })
        .catch(function(){ return []; });
      Promise.all([pPred, pRes]).then(function(arr){
        if (myToken !== compareToken) return; // stale, ignore
        render(arr[0], arr[1]);
      });
    }

    function bindHandlers(){
      $('cmp-date').addEventListener('change', function(){
        loadRaces(this.value).then(function(ctx){
          if (ctx && ctx.race) loadCompare(ctx.meeting.date, ctx.race.id || ctx.race.race_id);
        });
      });
      $('cmp-race').addEventListener('change', function(){
        var date = $('cmp-date').value;
        loadCompare(date, this.value);
      });
    }

    // Boot
    if (!window.TX_API){ setMeta('API 客戶端載入失敗'); return; }
    bindHandlers();
    loadMeetings().then(function(first){
      if (!first) return;
      return loadRaces(first.date).then(function(ctx){
        if (ctx && ctx.race) loadCompare(first.date, ctx.race.id || ctx.race.race_id);
      });
    }).catch(function(e){
      setMeta('載入失敗：' + (e && e.message || '網絡錯誤'));
    });
  })();
  </script>
  </body>
  </html>
