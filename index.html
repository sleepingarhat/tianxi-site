<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<script src="/assets/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDFBF5">
<title>天喜 TIANXI · 下一個賽馬日</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/shell.css">
<script src="/assets/api.js"></script>
<style>
.next-label{padding:14px 20px 4px;font-size:11px;color:var(--ink-mute);letter-spacing:.14em;font-weight:700;text-transform:uppercase}
.meeting-hdr{padding:4px 20px 14px;border-bottom:1px solid var(--rule)}
.meeting-hdr__date{font-family:var(--font-display);font-weight:900;font-size:26px;letter-spacing:.01em;color:var(--ink);line-height:1.1}
.meeting-hdr__meta{margin-top:8px;font-size:12px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.meeting-hdr__meta b{color:var(--ink);font-weight:700}
.meeting-hdr__venue-chip{display:inline-block;background:var(--ink);color:var(--paper);font-family:var(--font-display);font-weight:700;font-size:11px;padding:4px 10px;border-radius:999px;letter-spacing:.08em;margin-right:8px}
.fallback-banner{margin:12px 20px 0;padding:10px 12px;background:var(--gold-tint);border:1px solid var(--gold-2);color:var(--brown);font-size:11px;border-radius:8px;line-height:1.45}
.races-list{padding:4px 0 16px}
.race-row{display:grid;grid-template-columns:48px 62px 1fr 20px;gap:12px;padding:14px 20px;border-bottom:1px solid var(--rule);align-items:center;color:var(--ink);transition:background 120ms}
.race-row:hover{background:var(--paper-2)}
.race-row:active{background:var(--paper-3)}
.race-row__round{width:40px;height:40px;border-radius:50%;background:var(--paper-2);border:1px solid var(--rule-2);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--ink)}
.race-row__time{font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--ink);line-height:1.1}
.race-row__time small{display:block;color:var(--ink-mute);font-size:10px;font-weight:500;margin-top:3px;letter-spacing:.08em}
.race-row__info{min-width:0}
.race-row__title{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race-row__sub{margin-top:3px;font-size:11px;color:var(--ink-mute);display:flex;flex-wrap:wrap;gap:3px 10px}
.race-row__sub span{white-space:nowrap}
.race-row__badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--green);color:var(--paper);letter-spacing:.08em;margin-left:6px;vertical-align:1px}
.race-row__chev{color:var(--ink-faint);font-family:var(--font-mono);font-size:16px;text-align:right}
.empty{padding:40px 20px;text-align:center;color:var(--ink-mute);font-size:13px}
.err{padding:20px;color:var(--red);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="shell">

<header class="brandbar">
  <a href="/" class="brand">
    <span class="brand__glyph" aria-hidden="true">
      <svg viewBox="0 0 40 40">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#00843D"/><stop offset="50%" stop-color="#8B5A2B"/><stop offset="100%" stop-color="#C8102E"/>
        </linearGradient></defs>
        <rect x="1" y="1" width="38" height="38" rx="7" fill="url(#g)" stroke="#D4A11E" stroke-width="0.8"/>
        <text x="20" y="28" font-family="Noto Serif TC, serif" font-size="24" font-weight="900" fill="#F5D77A" text-anchor="middle">喜</text>
      </svg>
    </span>
    <span class="brand__word">天喜 TIANXI<small>ENTERTAINMENT</small></span>
  </a>
  <div></div>
  <div class="brandbar__actions">
    <button type="button" class="theme-toggle" data-tx-theme-toggle aria-pressed="false" aria-label="切換至深色模式" title="切換深／淺色">
      <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><g stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="6.7" y2="6.7"/><line x1="17.3" y1="17.3" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.7" y2="17.3"/><line x1="17.3" y1="6.7" x2="19.1" y2="4.9"/></g></svg>
      <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a1 1 0 0 0-1.3-1.3 10 10 0 1 0 13.1 13.1 1 1 0 0 0-1.3-1.3z"/></svg>
    </button>
  </div>
</header>

<div class="next-label" id="next-label">下一個賽馬日</div>
<section class="meeting-hdr" id="meeting-hdr">
  <div class="meeting-hdr__date" id="meeting-date">載入中…</div>
  <div class="meeting-hdr__meta" id="meeting-meta"></div>
</section>
<div id="fallback-slot"></div>

<section class="races-list" id="races-list" aria-label="場次列表">
  <div class="empty" id="races-loading">載入場次…</div>
</section>

<footer style="margin:0 20px 24px;padding-top:16px;font-size:11px;color:var(--ink-mute);line-height:1.55;border-top:1px solid var(--rule)">
  <strong>天喜為分析平台，不提供投注服務。</strong>投注請透過合法渠道（HKJC）進行。此處顯示所有賠率、投注分佈、組合機率純屬資訊展示，非投注建議。
</footer>

<nav class="botnav">
  <a href="/dashboard/" class="botnav__item" data-page="dashboard">
    <svg class="botnav__icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
    儀表板
  </a>
  <a href="/predictor/" class="botnav__item" data-page="predictor">
    <svg class="botnav__icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
    選馬
  </a>
  <a href="/schedule/" class="botnav__item" data-page="schedule">
    <svg class="botnav__icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
    日程
  </a>
  <a href="/encyclopedia/" class="botnav__item" data-page="encyclopedia">
    <svg class="botnav__icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
    百科
  </a>
  <a href="/lounge/" class="botnav__item" data-page="lounge">
    <svg class="botnav__icon" viewBox="0 0 24 24"><path d="M21 12a8 8 0 1 1-3.5-6.6L21 4v5h-5"/></svg>
    聊天室
  </a>
</nav>

</div>

<script>
(function(){
  var VENUE_MAP = { HV: '跑馬地', ST: '沙田' };

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  }); }

  function cleanTime(t){ return TX_API.cleanTime ? TX_API.cleanTime(t) : t; }

  function renderRaces(races){
    var list = document.getElementById('races-list');
    list.innerHTML = '';
    if (!races || !races.length){
      list.innerHTML = '<div class="empty">未有場次資料</div>';
      return;
    }
    races.forEach(function(r){
      var id = r.id || r.raceId;
      var a = document.createElement('a');
      a.className = 'race-row';
      a.href = id ? ('/race/?raceId=' + encodeURIComponent(id)) : '#';
      var rn = r.raceNumber || r.race_no || r.no || '';
      var time = cleanTime(r.startTime || r.start_time || '') || '--:--';
      var cls = r.className || r.class_name || r.class || '';
      var dist = r.distanceM || r.distance_m || r.distance || '';
      var going = r.going || '';
      var handicap = r.handicapType || r.handicap_type || '';
      var open = r.isAcceptingBets || r.accepting;
      a.innerHTML =
        '<div class="race-row__round">' + esc(rn) + '</div>' +
        '<div class="race-row__time">' + esc(time) + '<small>開跑</small></div>' +
        '<div class="race-row__info">' +
          '<div class="race-row__title">' + esc(cls || '—') +
            (open ? '<span class="race-row__badge">接受投注</span>' : '') +
          '</div>' +
          '<div class="race-row__sub">' +
            (dist ? '<span>' + esc(dist) + '米</span>' : '') +
            (going ? '<span>' + esc(going) + '</span>' : '') +
            (handicap ? '<span>' + esc(handicap) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="race-row__chev">›</div>';
      list.appendChild(a);
    });
  }

  function renderMeeting(m, isFallback){
    var d = m.date;
    document.getElementById('meeting-date').textContent = TX_API.fmtMeetingDate(d) || d;
    var venueName = m.venueName || VENUE_MAP[m.venue] || m.venue || '';
    var going = m.trackCondition || m.going || '';
    var meta = document.getElementById('meeting-meta');
    var chip = '<span class="meeting-hdr__venue-chip">' + esc(venueName) + '</span>';
    var bits = [];
    if (going) bits.push('<b>場地</b> ' + esc(going));
    if (m.races) bits.push('<b>場次</b> ' + m.races.length + ' 場');
    meta.innerHTML = chip + bits.join('');
    if (isFallback){
      document.getElementById('next-label').textContent = '最近賽馬日（數據同步中）';
      document.getElementById('fallback-slot').innerHTML =
        '<div class="fallback-banner">' +
          '<b>日程同步中：</b>最新可用資料為 ' + esc(TX_API.fmtMeetingDate(d) || d) +
          '。系統每日自動爬取 HKJC 結果，新場次將於同步後顯示。' +
        '</div>';
    }
    renderRaces(m.races || []);
  }

  function boot(){
    (TX_API.nextMeeting ? TX_API.nextMeeting() : Promise.reject(new Error('no-next-api')))
      .then(function(data){
        if (data && data.date) renderMeeting(data, !!data.fallback);
        else throw new Error('empty');
      })
      .catch(function(){
        TX_API.smartCurrent().then(function(data){
          if (data && data.meeting) renderMeeting(data.meeting, true);
          else if (data && data.date) renderMeeting(data, true);
          else {
            document.getElementById('races-list').innerHTML =
              '<div class="err">暫無賽馬日資料</div>';
          }
        }).catch(function(e){
          document.getElementById('races-list').innerHTML =
            '<div class="err">載入失敗：' + esc(e && e.message ? e.message : '網絡錯誤') + '</div>';
        });
      });
  }

  boot();
})();
</script>
</body>
</html>
