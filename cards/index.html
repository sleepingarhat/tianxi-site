<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<script src="/assets/theme.js"></script>
<script src="/assets/shell.js" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>逐場預測 · 天喜 TIANXI</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/shell.css">
<link rel="stylesheet" href="/assets/race-card.css">
<script src="/assets/api.js"></script>
<script src="/assets/engine-mode.js"></script>
<script src="/assets/race-card.js"></script>
<script src="/assets/form-tools.js"></script>
<style>
.cards-toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 12px}
.cards-toolbar select{font:inherit;padding:8px 10px;border:1px solid var(--rule-2);border-radius:8px;background:var(--paper-2);min-height:44px}
.cards-list,.cards-demo{padding:0 20px 24px;display:flex;flex-direction:column;gap:12px}
.cards-lead{font-size:13px;line-height:1.7;color:var(--ink-soft);padding:0 20px 12px;text-wrap:pretty}
.cards-k{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--ink-mute);padding:8px 20px 0}
.tx-ed{display:inline-block;font-family:var(--font-mono);font-weight:800;font-size:10px;letter-spacing:.08em;padding:2px 8px;border-radius:99px;border:1px solid var(--rule);margin-left:6px;vertical-align:middle}
.tx-ed.is-final{color:#2E2108;border-color:#A07A1F;background:linear-gradient(180deg,#FFF4C2,#EBC964)}
.tx-ed.is-draft{color:var(--ink-mute)}
.xg{display:grid;grid-template-columns:28px 1fr repeat(4,minmax(44px,1fr));gap:6px;font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.xg b{font-family:var(--font-display)}
.xg .hd{color:var(--ink-mute);font-size:10px}
</style>
</head>
<body data-page="cards">
<div class="shell">
<header class="brandbar" data-tx-shell="brandbar"></header>
<section class="page-head">
  <h1><small>RACE CARDS</small>逐場預測與賽果</h1>
</section>
<p class="cards-lead">每輪預測標明 <span class="tx-ed is-draft">初版</span>（未鎖，可刷新）或 <span class="tx-ed is-final">最終版</span>（已鎖，對賬用呢套）。規格：第一場開跑前 1.5 小時鎖、T−1h 出卡；而家已完場日顯示最終版。Telegram <a href="https://t.me/TX_Oracle">@TX_Oracle</a>。</p>
<div class="cards-k">SAMPLE · 2026-07-15 HV</div>
<div class="cards-demo" id="demo"></div>
<div class="cards-k">條件格 · 場地／途程／路況三甲 · 近 3 仗</div>
<div class="cards-demo" id="expert"></div>
<div class="cards-toolbar">
  <select id="mode"><option value="post">預測與賽果比對</option><option value="pre">賽前預測</option></select>
  <select id="date"></select>
</div>
<div class="cards-list" id="list"></div>
<footer class="disclaimer"><strong>天喜為分析平台，不提供投注服務。</strong></footer>
<nav class="botnav" data-tx-shell="botnav"></nav>
</div>
<script>
(function(){
  var V={'ST':'沙田','HV':'跑馬地'};
  var pre = { raceNumber:1, distance:1650, class:'5', going:'好地', picks:[
    {rank:1,horseNumber:9,nameCh:'架勢奇爸',draw:9,jockeyCh:'布文',trainerCh:'告東尼',actualWeight:126,style:'前'},
    {rank:2,horseNumber:10,nameCh:'幸運福星',draw:10,jockeyCh:'霍宏聲',trainerCh:'呂健威',actualWeight:125,style:'中'},
    {rank:3,horseNumber:12,nameCh:'勁爽',draw:12,actualWeight:123,style:'前'},
    {rank:4,horseNumber:11,nameCh:'電訊驕陽',draw:11,actualWeight:122,style:'中'}
  ]};
  var post = {
    raceNumber:2,
    predictedTop4:[{horseNumber:9},{horseNumber:4},{horseNumber:2},{horseNumber:1}],
    actualTop4:[{horseNumber:10},{horseNumber:9},{horseNumber:4},{horseNumber:2}],
    actualTop3:[{horseNumber:10},{horseNumber:9},{horseNumber:4}],
    dividends:{QP:186}
  };
  document.getElementById('demo').innerHTML =
    TXRaceCard.renderPre(pre,{dateLabel:'7月15日',venue:'跑馬地'}) +
    TXRaceCard.renderPost(post,{dateLabel:'7月15日',venue:'跑馬地'});
  document.getElementById('expert').innerHTML = '<div class="txc"><div class="xg">' +
    '<div class="hd"></div><div class="hd">馬</div><div class="hd">跑馬地</div><div class="hd">1650</div><div class="hd">好地</div><div class="hd">近3</div>' +
    '<div>1</div><div><b>9 架勢奇爸</b></div><div>2/6</div><div>1/3</div><div>3/8</div><div>3-5-2</div>' +
    '<div>2</div><div><b>10 幸運福星</b></div><div>3/7</div><div>2/4</div><div>4/9</div><div>2-1-4</div>' +
    '<div>3</div><div><b>12 勁爽</b></div><div>1/5</div><div>0/2</div><div>2/6</div><div>6-3-8</div>' +
    '<div>4</div><div><b>11 電訊驕陽</b></div><div>4/8</div><div>2/3</div><div>3/7</div><div>1-4-3</div>' +
    '</div></div>';
  function $(id){return document.getElementById(id);}
  function labelDate(iso){ if(!iso) return ''; var p=iso.split('-'); return Number(p[1])+'月'+Number(p[2])+'日'; }
  fetch('https://tianxi.racing/api/meetings').then(function(r){return r.json();}).then(function(d){
    var sel=$('date');
    sel.innerHTML=(d.meetings||[]).slice(0,24).map(function(m){ return '<option value="'+m.date+'">'+m.date+' · '+(V[m.venue]||'')+'</option>'; }).join('');
    function render(){
      var mode=$('mode').value, date=$('date').value, list=$('list');
      if(!date){list.textContent='';return;}
      var today = new Date().toISOString().slice(0,10);
      var settled = date && date < today;
      var path = (!settled && mode==='pre') ? '/api/analyze/today-picks' : '/api/analyze/hit-rate?date='+encodeURIComponent(date);
      if (settled) mode = 'post';
      fetch('https://tianxi.racing'+path).then(function(r){return r.json();}).then(function(x){
        var races=x.races||[];
        var ed = window.TX_ENGINE_MODE ? TX_ENGINE_MODE.edition({ settled: settled || mode==='post', frozen: !!(x && x.frozen) }) : null;
        var head = ed ? '<div class="cards-k">此輪預測 '+TX_ENGINE_MODE.badgeHtml(ed)+' · '+ed.note+'</div>' : '';
        list.innerHTML=head+races.map(function(r){
          return mode==='pre' ? TXRaceCard.renderPre(r,{dateLabel:labelDate(x.date||date),venue:V[x.venue]||x.venue||''}) : TXRaceCard.renderPost(r,{dateLabel:labelDate(x.date||date),venue:V[x.venue]||x.venue||''});
        }).join('') || '呢日未有場次。';
      }).catch(function(){list.textContent='載入失敗';});
    }
    $('mode').onchange = $('date').onchange = render;
    render();
  });
})();
</script>
</body>
</html>
