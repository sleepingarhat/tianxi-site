<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<script src="/assets/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDFBF5">
<title>馬圈聊天室 · 天喜 TIANXI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/shell.css">
<script src="/assets/api.js"></script>
<script src="/assets/anon-identity.js"></script><style>
.chat-wrap{display:flex;flex-direction:column;min-height:calc(100vh - 220px)}
.chat-room{flex:1;padding:14px 20px 120px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.45;word-wrap:break-word;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.msg__head{font-size:10px;color:var(--ink-faint);margin-bottom:3px;font-family:var(--font-mono);display:flex;gap:6px;align-items:center}
.msg__body{white-space:pre-wrap}
.msg--mine{align-self:flex-end;background:var(--ink);color:var(--gold-3);border-bottom-right-radius:4px}
.msg--mine .msg__head{color:var(--gold-2);justify-content:flex-end}
.msg--other{align-self:flex-start;background:var(--paper-2);color:var(--ink);border:1px solid var(--rule);border-bottom-left-radius:4px}
.msg--sys{align-self:center;background:transparent;color:var(--ink-mute);font-size:11px;padding:4px 10px;border:1px dashed var(--rule-2);border-radius:10px}

.empty-state{padding:48px 20px;text-align:center;color:var(--ink-mute);font-size:13px}
.err-state{padding:14px 20px;text-align:center;color:var(--red);font-size:12px}

.composer{position:fixed;left:0;right:0;bottom:56px;max-width:440px;margin:0 auto;padding:10px 12px;background:var(--paper);border-top:1px solid var(--rule);display:flex;gap:8px;align-items:flex-end;z-index:50}
.composer textarea{flex:1;border:1px solid var(--rule-2);border-radius:18px;padding:10px 14px;font-family:var(--font-body);font-size:13px;resize:none;background:var(--paper-2);color:var(--ink);min-height:40px;max-height:120px;line-height:1.4}
.composer textarea:focus{outline:2px solid var(--accent);outline-offset:0}
.composer button{flex-shrink:0;width:44px;height:40px;border-radius:20px;background:var(--ink);color:var(--gold-3);border:0;font-family:var(--font-display);font-weight:700;font-size:13px;cursor:pointer;display:grid;place-items:center}
.composer button:disabled{opacity:.45;cursor:not-allowed}
.composer button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.gate{position:fixed;inset:0;background:rgba(11,11,11,.55);z-index:900;display:flex;align-items:center;justify-content:center;padding:24px}
.gate__card{background:var(--paper);border-radius:14px;max-width:380px;width:100%;padding:22px;box-shadow:var(--sh-lg)}
.gate__card h3{font-family:var(--font-display);font-weight:700;font-size:17px;margin-bottom:8px}
.gate__card p{font-size:12px;color:var(--ink-mute);line-height:1.5;margin-bottom:14px}
.gate__card label{display:block;font-size:11px;color:var(--ink-mute);margin-bottom:4px}
.gate__card input{width:100%;padding:10px 12px;border:1px solid var(--rule-2);border-radius:8px;background:var(--paper-2);color:var(--ink);font-family:var(--font-body);font-size:14px}
.gate__card button{width:100%;margin-top:12px;padding:11px;background:var(--ink);color:var(--gold-3);border:0;border-radius:8px;font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer}
.gate__err{color:var(--red);font-size:11px;margin-top:6px;min-height:14px}

.handle-tag{display:inline-block;padding:2px 8px;border-radius:9px;background:var(--paper-3);font-size:11px;color:var(--ink-mute);cursor:pointer}

.compose-err{padding:4px 20px 0;color:var(--red);font-size:11px;min-height:14px;font-family:var(--font-mono)}
</style>
</head>
<body>
<div class="shell">

<header class="brandbar">
  <a href="/" class="brand">
    <span class="brand__glyph" aria-hidden="true">
      <svg viewBox="0 0 40 40">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#00843D"/><stop offset="50%" stop-color="#8B5A2B"/><stop offset="100%" stop-color="#C8102E"/>
        </linearGradient></defs>
        <rect x="1" y="1" width="38" height="38" rx="7" fill="url(#g)" stroke="#D4A11E" stroke-width="0.8"/>
        <text x="20" y="28" font-family="Noto Serif TC, serif" font-size="24" font-weight="900" fill="#F5D77A" text-anchor="middle">喜</text>
      </svg>
    </span>
    <span class="brand__word">天喜 TIANXI<small>ENTERTAINMENT</small></span>
  </a>
  <div></div>
  <div class="brandbar__actions">
    <button type="button" class="theme-toggle" data-tx-theme-toggle aria-pressed="false" aria-label="切換至深色模式" title="切換深／淺色">
      <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><g stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="6.7" y2="6.7"/><line x1="17.3" y1="17.3" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.7" y2="17.3"/><line x1="17.3" y1="6.7" x2="19.1" y2="4.9"/></g></svg>
      <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a1 1 0 0 0-1.3-1.3 10 10 0 1 0 13.1 13.1 1 1 0 0 0-1.3-1.3z"/></svg>
    </button>
  </div>
</header>

<section class="page-head">
  <h1><small>RACING LOUNGE</small>馬圈聊天室</h1>
  <p>單一開放房間 · 同其他馬迷即時傾偈 · 純分析討論，不涉投注交易</p>
  <div style="margin-top:6px;font-size:11px;color:var(--ink-mute)">
    你以 <strong id="handle-display">—</strong> 身份發言 <span class="handle-tag" id="edit-handle">[改名]</span>
  </div>
</section>

<div class="chat-wrap">
  <div class="chat-room" id="room" aria-live="polite">
    <div class="empty-state" id="loading">載入中...</div>
  </div>
</div>

<div class="compose-err" id="send-err"></div>
<div class="composer">
  <textarea id="msg" rows="1" placeholder="輸入訊息 · Enter 發送 · Shift+Enter 換行" maxlength="4000"></textarea>
  <button id="send-btn" aria-label="發送">
    <svg viewBox="0 0 24 24"><path d="M5 12l14-7-4 7 4 7-14-7z"/></svg>
  </button>
</div>

<footer class="disclaimer" style="margin-bottom:64px">
  <strong>社群守則：</strong>禁止投注碼／下注建議／代買代過數 · 違者封鎖<br>
  <strong>天喜為分析平台，不提供投注服務。</strong>投注請透過合法渠道（HKJC）進行。
</footer>

<!-- Registration gate: shown on first entry if user hasn't picked a custom handle -->
<div class="gate" id="gate" style="display:none">
  <div class="gate__card">
    <h3>入聊天室前先改個暱稱</h3>
    <p>改個識別得到嘅名，其他馬迷先知你係邊個。<br>上限 24 字 · 隨時可以再改。</p>
    <label>你嘅暱稱</label>
    <input id="gate-handle" maxlength="24" placeholder="例：沙田快跑王">
    <div class="gate__err" id="gate-err"></div>
    <button id="gate-ok">入聊天室</button>
  </div>
</div>

<nav class="botnav">
  <a href="/dashboard/" class="botnav__item" data-page="dashboard">
    <svg class="botnav__icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
    儀表板
  </a>
  <a href="/predictor/" class="botnav__item" data-page="predictor">
    <svg class="botnav__icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
    選馬
  </a>
  <a href="/schedule/" class="botnav__item" data-page="schedule">
    <svg class="botnav__icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
    日程
  </a>
  <a href="/encyclopedia/" class="botnav__item" data-page="encyclopedia">
    <svg class="botnav__icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
    百科
  </a>
  <a href="/lounge/" class="botnav__item" data-page="lounge">
    <svg class="botnav__icon" viewBox="0 0 24 24"><path d="M21 12a8 8 0 1 1-3.5-6.6L21 4v5h-5"/></svg>
    聊天室
  </a>
</nav>

</div>

<script>
(function(){
  var REGISTERED_KEY = 'tx-lounge-registered';
  var POLL_MS = 3000;

  var room = document.getElementById('room');
  var msgInput = document.getElementById('msg');
  var sendBtn = document.getElementById('send-btn');
  var sendErr = document.getElementById('send-err');
  var handleDisplay = document.getElementById('handle-display');
  var editHandle = document.getElementById('edit-handle');
  var gate = document.getElementById('gate');
  var gateInput = document.getElementById('gate-handle');
  var gateOk = document.getElementById('gate-ok');
  var gateErr = document.getElementById('gate-err');

  // mark active nav
  document.querySelectorAll('.botnav__item').forEach(function(a){
    if (a.getAttribute('data-page') === 'lounge') a.classList.add('is-active');
  });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtTime(iso){
    if (!iso) return '';
    var d = new Date(iso.replace(' ','T') + 'Z');
    if (isNaN(d)) return '';
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    var hh = String(d.getHours()).padStart(2,'0');
    var mm = String(d.getMinutes()).padStart(2,'0');
    if (sameDay) return hh + ':' + mm;
    var mo = String(d.getMonth()+1).padStart(2,'0');
    var dy = String(d.getDate()).padStart(2,'0');
    return mo + '-' + dy + ' ' + hh + ':' + mm;
  }

  function isRegistered(){
    try { return !!localStorage.getItem(REGISTERED_KEY); } catch(e){ return false; }
  }
  function markRegistered(){
    try { localStorage.setItem(REGISTERED_KEY, '1'); } catch(e){}
  }

  function refreshHandleDisplay(){
    handleDisplay.textContent = window.TX_ID ? window.TX_ID.handle : '馬迷';
  }

  var seenIds = {};
  var lastCreatedAt = null;

  function renderMessage(p){
    if (seenIds[p.id]) return;
    seenIds[p.id] = true;
    if (p.createdAt && (!lastCreatedAt || p.createdAt > lastCreatedAt)) {
      lastCreatedAt = p.createdAt;
    }
    var mine = window.TX_ID && p.authorId === window.TX_ID.id;
    var cls = mine ? 'msg msg--mine' : 'msg msg--other';
    var el = document.createElement('div');
    el.className = cls;
    el.innerHTML =
      '<div class="msg__head">' +
        '<span>' + escapeHtml(p.authorHandle || '匿名') + '</span>' +
        '<span>' + escapeHtml(fmtTime(p.createdAt)) + '</span>' +
      '</div>' +
      '<div class="msg__body">' + escapeHtml(p.body) + '</div>';
    room.appendChild(el);
  }

  function scrollBottom(){
    window.scrollTo(0, document.body.scrollHeight);
  }

  function loadInitial(){
    TX_API.lounge.chat(null, 100).then(function(data){
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
      if (!data.posts || !data.posts.length) {
        var empty = document.createElement('div');
        empty.className = 'msg msg--sys';
        empty.textContent = '暫無訊息 · 做第一個打招呼嘅人';
        room.appendChild(empty);
      } else {
        data.posts.forEach(renderMessage);
      }
      scrollBottom();
      startPolling();
    }).catch(function(e){
      var loading = document.getElementById('loading');
      if (loading) {
        loading.className = 'err-state';
        loading.textContent = '載入失敗：' + (e && e.message ? e.message : '網絡錯誤');
      }
    });
  }

  var pollTimer = null;
  function pollOnce(){
    if (!lastCreatedAt) return;
    TX_API.lounge.chat(lastCreatedAt, 100).then(function(data){
      if (data.posts && data.posts.length) {
        var nearBottom = (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 120;
        data.posts.forEach(renderMessage);
        if (nearBottom) scrollBottom();
      }
    }).catch(function(){ /* silent — transient */ });
  }
  function startPolling(){
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(pollOnce, POLL_MS);
    document.addEventListener('visibilitychange', function(){
      if (document.hidden) { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
      else if (!pollTimer) { pollTimer = setInterval(pollOnce, POLL_MS); pollOnce(); }
    });
  }

  function setSendEnabled(on){
    sendBtn.disabled = !on;
  }

  function sendMessage(){
    var text = (msgInput.value || '').trim();
    if (!text) return;
    sendErr.textContent = '';
    setSendEnabled(false);
    TX_API.lounge.send({
      body: text,
      authorHandle: window.TX_ID.handle,
      authorId: window.TX_ID.id,
    }).then(function(){
      msgInput.value = '';
      msgInput.style.height = '';
      // poll immediately so the new msg appears
      pollOnce();
      setSendEnabled(true);
      msgInput.focus();
    }).catch(function(e){
      sendErr.textContent = (e && e.message) ? e.message : '發送失敗';
      setSendEnabled(true);
    });
  }

  // Composer behavior
  msgInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  msgInput.addEventListener('input', function(){
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  });
  sendBtn.addEventListener('click', sendMessage);

  // Handle edit (re-open gate in re-name mode)
  editHandle.addEventListener('click', function(){
    gateInput.value = window.TX_ID ? window.TX_ID.handle : '';
    gateErr.textContent = '';
    gate.style.display = 'flex';
    setTimeout(function(){ gateInput.focus(); gateInput.select(); }, 50);
  });

  gateOk.addEventListener('click', function(){
    var v = (gateInput.value || '').trim();
    if (!v) { gateErr.textContent = '請輸入暱稱'; return; }
    if (v.length > 24) { gateErr.textContent = '暱稱過長（上限 24 字）'; return; }
    window.TX_ID.setHandle(v);
    refreshHandleDisplay();
    markRegistered();
    gate.style.display = 'none';
  });
  gateInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); gateOk.click(); }
  });

  // Boot
  refreshHandleDisplay();
  if (!isRegistered()) {
    gateInput.value = (window.TX_ID && window.TX_ID.handle) || '';
    gate.style.display = 'flex';
    setTimeout(function(){ gateInput.focus(); gateInput.select(); }, 50);
  }
  loadInitial();
})();
</script>
</body>
</html>
