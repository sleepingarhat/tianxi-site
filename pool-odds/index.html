<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<script src="/assets/theme.js"></script><script src="/assets/shell.js" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>彩池賠率 · 天喜 TIANXI</title>
<link rel="stylesheet" href="/assets/tokens.css"><link rel="stylesheet" href="/assets/shell.css"><script src="/assets/api.js"></script>
<style>
.pool-tabs{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--paper-2);border-bottom:1px solid var(--rule)}
.pool-tabs label{font:700 10px var(--font-mono);color:var(--ink-mute)}.pool-tabs select{flex:1;padding:8px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.odds-grid{padding:0 16px}.odds-row{display:grid;grid-template-columns:32px 1fr 60px;gap:8px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:center}.odds-row .horse{font:600 13px var(--font-display)}.odds-row .horse a{color:inherit;text-decoration:none}.odds-row .horse small{display:block;font:10px var(--font-body);color:var(--ink-mute);margin-top:2px}.odds-cell{font:700 14px var(--font-mono);text-align:right}.horse-num-box{font:700 14px var(--font-mono);color:var(--gold-2);text-align:center;background:var(--paper-3);border-radius:4px;padding:4px 0}.legend{padding:10px 16px;font-size:10px;color:var(--ink-mute);border-bottom:1px solid var(--rule)}
</style>
</head>
<body data-page="pool-odds"><div class="shell"><header class="brandbar" data-tx-shell="brandbar"></header>
<div class="ticker" id="pool-ticker"><strong>彩池賠率</strong> · 載入中</div>
<section class="page-head"><h1><small>WIN ODDS · API DATA</small>彩池賠率</h1><p>展示 API 實際提供的獨贏資料；未有資料不作推測。資訊展示 · 非投注介面</p></section>
<div class="pool-tabs"><label for="pool-race">選擇場次</label><select id="pool-race" disabled><option>載入中</option></select></div><div class="legend">本頁只展示 API 實際提供的獨贏賠率。</div>
<div class="card" style="padding:12px 8px"><h2 style="padding:0 8px" id="pool-title">載入賽事中</h2><div class="odds-grid"><div class="odds-row" style="font-size:10px;color:var(--ink-mute)"><div>馬</div><div>馬名 騎師</div><div>獨贏</div></div><div id="pool-rows"><div class="empty">載入賽事資料中</div></div></div><div id="pool-updated" style="padding:8px;font-size:10px;color:var(--ink-faint);text-align:right"></div></div>
<footer class="disclaimer"><strong>天喜為分析平台，不提供投注服務。</strong><br>投注請透過合法渠道（HKJC）進行。本頁數據僅供研究分析。</footer><nav class="botnav" data-tx-shell="botnav"></nav></div>
<script>
(function(){
  var meeting, styles = {}, select = document.getElementById('pool-race');
  function esc(value){ return String(value == null ? '' : value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function horses(race){ return (race && (race.horses || race.entries) || []).filter(function(h){ return (h.horseId || h.horse_id || h.id) && (h.nameCh || h.name || h.nameEn); }); }
  function render(){
    var race=(meeting.races||[]).filter(function(r){return String(r.id||r.raceId)===select.value;})[0], rows=horses(race);
    document.getElementById('pool-title').textContent='R'+(race.raceNumber||race.race_no||'')+' · '+(meeting.venueName||meeting.venue||'');
    document.getElementById('pool-rows').innerHTML=rows.length?rows.map(function(h){
      var id=TX_API.canonicalHorseId(h.horseId||h.horse_id||h.id), href=TX_API.horseHref(id,race.id||race.raceId);
      var name=esc(h.nameCh||h.name||h.nameEn)+(styles[id]?TX_API.runningStyleBadge(styles[id]):'');
      var odds=h.winOdds!=null?h.winOdds:h.win_odds;
      return '<div class="odds-row"><div class="horse-num-box">'+esc(h.horseNumber||h.no||'')+'</div><div class="horse">'+(href?'<a href="'+href+'">'+name+'</a>':name)+'<small>'+esc([h.jockeyCh||h.jockey,h.trainerCh||h.trainer].filter(Boolean).join(' · '))+'</small></div><div class="odds-cell">'+(odds==null?'':esc(odds))+'</div></div>';
    }).join(''):'<div class="empty">此場暫無可展示的馬匹資料</div>';
  }
  function loadStyles(){ var race=(meeting.races||[]).filter(function(r){return String(r.id||r.raceId)===select.value;})[0]; styles={}; return TX_API.runningStyles(horses(race).map(function(h){return h.horseId||h.horse_id||h.id;}),{raceId:race.id||race.raceId}).then(function(data){(data.styles||[]).forEach(function(s){styles[s.horseId]=s;});render();}); }
  TX_API.smartCurrent().then(function(current){ return TX_API.meeting(current.date).then(function(data){ meeting=data; var races=meeting.races||[]; select.innerHTML=races.map(function(r){return '<option value="'+esc(r.id||r.raceId)+'">R'+esc(r.raceNumber||r.race_no||'')+'</option>';}).join('');select.disabled=!races.length;document.getElementById('pool-ticker').innerHTML='<strong>'+esc(current.mode==='historical'?'歷史賽日':'現行賽日')+'</strong> · '+esc(current.date||'');if(races.length){select.onchange=loadStyles;return loadStyles();} }); }).catch(function(){document.getElementById('pool-rows').innerHTML='<div class="empty">賽事資料暫時未能載入</div>';});
}());
</script>
</body></html>
