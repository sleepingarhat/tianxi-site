<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<script src="/assets/theme.js"></script>
<script src="/assets/shell.js" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDFBF5">
<title>六合彩 · 天喜 TIANXI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/shell.css">
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
<script src="https://cdn.jsdelivr.net/gh/sleepingarhat/tianxi-marksix@main/web/marksix/engine.js"></script>
<style>
.m6-sec{padding:0 16px;margin-top:18px}
.m6-h2{font-family:var(--font-display);font-weight:900;font-size:16px;color:var(--ink);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.m6-h2 small{font-family:var(--font-mono);font-weight:500;font-size:10px;color:var(--ink-mute);letter-spacing:.08em}
.m6-note{font-size:11px;color:var(--ink-mute);line-height:1.6}
.m6-state{padding:24px 16px;text-align:center;color:var(--ink-mute);font-size:13px}
.m6-state.err{color:var(--red)}
.m6-ball{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-family:var(--font-mono);font-weight:800;color:#0d0d0d;line-height:1;flex-shrink:0;isolation:isolate;box-shadow:0 2px 4px rgba(0,0,0,.28)}
.m6-ball::before{content:"";position:absolute;left:23%;top:23%;width:54%;height:54%;border-radius:50%;background:radial-gradient(circle at 42% 36%,#fff,#e9ecee 88%);box-shadow:0 0 0 1px rgba(0,0,0,.06) inset,0 1px 2px rgba(0,0,0,.20);z-index:-1}
.m6-ball.red{background:radial-gradient(circle at 50% 7%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 50% 93%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 7% 50%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 93% 50%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 20% 20%,#fff 0 5%,transparent 6%),radial-gradient(circle at 80% 20%,#fff 0 5%,transparent 6%),radial-gradient(circle at 20% 80%,#fff 0 5%,transparent 6%),radial-gradient(circle at 80% 80%,#fff 0 5%,transparent 6%),radial-gradient(circle at 38% 30%,#f0566a,#d31329 58%,#9e0a1e)}
.m6-ball.blue{background:radial-gradient(circle at 50% 7%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 50% 93%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 7% 50%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 93% 50%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 20% 20%,#fff 0 5%,transparent 6%),radial-gradient(circle at 80% 20%,#fff 0 5%,transparent 6%),radial-gradient(circle at 20% 80%,#fff 0 5%,transparent 6%),radial-gradient(circle at 80% 80%,#fff 0 5%,transparent 6%),radial-gradient(circle at 38% 30%,#4f9be8,#1064c4 58%,#06407f)}
.m6-ball.green{background:radial-gradient(circle at 50% 7%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 50% 93%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 7% 50%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 93% 50%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 20% 20%,#fff 0 5%,transparent 6%),radial-gradient(circle at 80% 20%,#fff 0 5%,transparent 6%),radial-gradient(circle at 20% 80%,#fff 0 5%,transparent 6%),radial-gradient(circle at 80% 80%,#fff 0 5%,transparent 6%),radial-gradient(circle at 38% 30%,#5cc77c,#0c9a3f 58%,#066628)}
.m6-ball--lg{width:clamp(30px,calc((100vw - 120px)/7),46px);height:clamp(30px,calc((100vw - 120px)/7),46px);font-size:clamp(13px,3.4vw,19px)}
.m6-ball--md{width:36px;height:36px;font-size:14px}
.m6-ball--sm{width:30px;height:30px;font-size:12px}
.m6-ball.hit{outline:2px solid var(--green-2)}
.m6-ball.sp{outline:2px solid var(--gold)}
.m6-result{padding:16px;margin:0 16px}
.m6-rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:14px}
.m6-rhead .draw{font-family:var(--font-display);font-weight:900;font-size:22px;color:var(--ink)}
.m6-rhead .date{font-size:12px;color:var(--ink-mute)}
.m6-snow{font-size:11px;font-weight:700;color:var(--gold-3);background:var(--ink);padding:2px 9px;border-radius:999px}
.m6-balls{display:flex;align-items:center;justify-content:center;gap:clamp(3px,1.3vw,7px);flex-wrap:nowrap;padding:6px 0 4px}
.m6-plus{font-family:var(--font-display);font-weight:700;font-size:clamp(15px,4vw,20px);color:var(--ink-mute);margin:0;flex-shrink:0}
.m6-balls-cap{font-size:10px;color:var(--ink-faint);margin:6px 0 14px}
.m6-prize{width:100%;border-collapse:collapse;margin-top:4px}
.m6-prize th,.m6-prize td{padding:7px 8px;font-size:12px;border-bottom:1px solid var(--rule);text-align:right}
.m6-prize th{font-size:10px;color:var(--ink-mute);font-weight:600}
.m6-prize td:first-child,.m6-prize th:first-child{text-align:left;font-weight:700}
.m6-prize .amt{font-family:var(--font-mono);font-weight:700;color:var(--green-2)}
.m6-prize tr.t1 td{background:var(--gold-tint)}
.m6-rfoot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.m6-stat{background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r-md);padding:10px 12px}
.m6-stat .k{font-size:10px;color:var(--ink-mute)}.m6-stat .v{font-family:var(--font-mono);font-weight:700;font-size:15px}
.m6-seg{display:flex;gap:2px;background:var(--paper-3);border-radius:var(--r-md);padding:3px;flex-wrap:wrap}
.m6-seg button{flex:1;min-width:54px;padding:7px 8px;font-size:12px;font-weight:600;color:var(--ink-mute);border-radius:6px}
.m6-seg button.active{background:var(--ink);color:var(--gold-3)}
.m6-controls{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.m6-numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:7px}
.m6-cell{position:relative;border:1px solid var(--rule);border-radius:var(--r-md);padding:8px 5px 6px;text-align:center;background:var(--paper);overflow:hidden}
.m6-cell .heat{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.m6-cell .m6-ball{margin:0 auto 5px}
.m6-cell .row{display:flex;justify-content:space-between;font-size:9px;color:var(--ink-mute);padding:1px 3px}
.m6-cell .row b{font-family:var(--font-mono);font-weight:700;color:var(--ink)}
.m6-cell .row b.due{color:var(--red)}
.m6-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:10px;color:var(--ink-mute);margin-bottom:10px}
.m6-res{padding:16px;margin:0 16px;border-top:3px solid var(--gold)}
.m6-res label{font-size:12px;color:var(--ink-mute);display:block;margin-bottom:4px}
.m6-res input{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;font-size:14px;margin-bottom:10px;background:var(--paper);color:var(--ink)}
.m6-res .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.m6-res .row2{grid-template-columns:1fr}}
.m6-btn{background:var(--ink);color:var(--gold-3);border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:13px}
.m6-btn.sec{background:var(--paper-2);color:var(--ink);border:1px solid var(--rule)}
.m6-nums{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.m6-meta{font-size:12px;color:var(--ink-mute);white-space:pre-wrap;background:var(--paper-2);border-left:3px solid var(--gold);padding:8px 10px;margin:8px 0;border-radius:0 8px 8px 0}
.m6-table{width:100%;border-collapse:collapse;font-size:12px}
.m6-table th,.m6-table td{border-bottom:1px solid var(--rule);padding:7px 6px;text-align:left}
.m6-score{font-family:var(--font-mono);font-weight:700}.m6-score.hi{color:var(--green-2)}
.m6-statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.m6-statbox{background:var(--paper-2);border:1px solid var(--rule);border-radius:8px;padding:10px}
.m6-statbox .k{font-size:11px;color:var(--ink-mute)}.m6-statbox .v{font-family:var(--font-mono);font-size:18px;font-weight:700}
.hidden{display:none}
</style>
</head>
<body data-page="marksix">
<div class="shell">
<header class="brandbar" data-tx-shell="brandbar"></header>
<div class="ticker" id="m6-ticker">六合彩 · 載入中…</div>
<section class="page-head">
  <h1><small>MARK SIX</small>六合彩</h1>
  <p>官方結果 · 號碼統計 · 八字／奇門研究。<br><span class="pill pill--gold">資訊展示 · 非投注介面</span></p>
</section>
<section class="card m6-result" id="m6-result"><div class="m6-state">載入中…</div></section>
<section class="m6-sec">
  <h2 class="m6-h2">號碼統計 <small>NUMBER FREQUENCY</small></h2>
  <div class="m6-controls">
    <div class="m6-seg" id="m6-periods"></div>
    <div class="m6-seg" id="m6-sort"></div>
  </div>
  <div class="m6-legend"><span><b>開</b> 次數</span> <span><b>遺</b> 遺漏</span> <span><b>期</b> 最大遺漏</span></div>
  <div class="m6-numgrid" id="m6-numgrid">載入中…</div>
</section>
<section class="m6-sec">
  <h2 class="m6-h2">八字／奇門研究 <small>BAZI · QIMEN</small></h2>
  <div class="card m6-res">
    <div class="row2">
      <div><label>攪珠日</label><input type="date" id="drawDate"></div>
      <div><label>個人出生（混合 · 含時辰）</label><input type="datetime-local" id="personalDT"></div>
    </div>
    <div class="m6-seg" id="modeTabs" style="margin-bottom:12px">
      <button type="button" data-mode="pure" class="active">純八字＋純奇門</button>
      <button type="button" data-mode="hybrid">個人混合</button>
      <button type="button" data-mode="backtest">100期回測</button>
    </div>
    <button class="m6-btn" id="runBtn" type="button">計算</button>
    <button class="m6-btn sec" id="loadLatest" type="button" style="margin-left:8px">載入最近一期</button>
    <p class="m6-note" id="status"></p>
    <div id="panelPure">
      <div class="m6-meta" id="methodBox">規則說明…</div>
      <div id="predBox"></div>
      <div id="cmpBox" style="margin-top:12px"></div>
    </div>
    <div id="panelHybrid" class="hidden"><div id="natalBox"></div><div id="hybridBox" style="margin-top:12px"></div></div>
    <div id="panelBT" class="hidden">
      <div id="btStats"></div>
      <div style="overflow:auto;max-height:420px;margin-top:12px">
        <table class="m6-table" id="btTable"><thead><tr><th>日期</th><th>八字</th><th>奇門</th><th>官方</th></tr></thead><tbody></tbody></table>
      </div>
    </div>
    <p class="m6-note" style="margin-top:12px">規則：<span id="ruleVer"></span> · 個人奇門＝出生時起時家奇門終身參考盤</p>
  </div>
</section>
<footer class="disclaimer"><strong>天喜為分析平台，不提供投注服務。</strong><br>投注請透過合法渠道（HKJC）進行。</footer>
<nav class="botnav" data-tx-shell="botnav"></nav>
</div>
<script src="https://cdn.jsdelivr.net/gh/sleepingarhat/tianxi-marksix@main/web/marksix/site-app.js"></script>
</body>
</html>
