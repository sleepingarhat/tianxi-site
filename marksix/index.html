<style>
/* ===== Mark Six page ===== */
.m6-sec{padding:0 16px;margin-top:18px}
.m6-h2{font-family:var(--font-display);font-weight:900;font-size:16px;color:var(--ink);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.m6-h2 small{font-family:var(--font-mono);font-weight:500;font-size:10px;color:var(--ink-mute);letter-spacing:.08em}
.m6-note{font-size:11px;color:var(--ink-mute);line-height:1.6}
.m6-state{padding:24px 16px;text-align:center;color:var(--ink-mute);font-size:13px}
.m6-state.err{color:var(--red)}

/* ----- official lottery balls (white petal-notches + white centre + black number) ----- */
.m6-ball{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
  font-family:var(--font-mono);font-weight:800;color:#0d0d0d;line-height:1;flex-shrink:0;isolation:isolate;
  box-shadow:0 2px 4px rgba(0,0,0,.28)}
.m6-ball::before{content:"";position:absolute;left:23%;top:23%;width:54%;height:54%;border-radius:50%;
  background:radial-gradient(circle at 42% 36%,#fff,#e9ecee 88%);
  box-shadow:0 0 0 1px rgba(0,0,0,.06) inset,0 1px 2px rgba(0,0,0,.20);z-index:-1}
.m6-ball.red{background:
  radial-gradient(circle at 50% 7%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 50% 93%,#fff 0 5.5%,transparent 6.5%),
  radial-gradient(circle at 7% 50%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 93% 50%,#fff 0 5.5%,transparent 6.5%),
  radial-gradient(circle at 20% 20%,#fff 0 5%,transparent 6%),radial-gradient(circle at 80% 20%,#fff 0 5%,transparent 6%),
  radial-gradient(circle at 20% 80%,#fff 0 5%,transparent 6%),radial-gradient(circle at 80% 80%,#fff 0 5%,transparent 6%),
  radial-gradient(circle at 38% 30%,#f0566a,#d31329 58%,#9e0a1e)}
.m6-ball.blue{background:
  radial-gradient(circle at 50% 7%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 50% 93%,#fff 0 5.5%,transparent 6.5%),
  radial-gradient(circle at 7% 50%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 93% 50%,#fff 0 5.5%,transparent 6.5%),
  radial-gradient(circle at 20% 20%,#fff 0 5%,transparent 6%),radial-gradient(circle at 80% 20%,#fff 0 5%,transparent 6%),
  radial-gradient(circle at 20% 80%,#fff 0 5%,transparent 6%),radial-gradient(circle at 80% 80%,#fff 0 5%,transparent 6%),
  radial-gradient(circle at 38% 30%,#4f9be8,#1064c4 58%,#06407f)}
.m6-ball.green{background:
  radial-gradient(circle at 50% 7%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 50% 93%,#fff 0 5.5%,transparent 6.5%),
  radial-gradient(circle at 7% 50%,#fff 0 5.5%,transparent 6.5%),radial-gradient(circle at 93% 50%,#fff 0 5.5%,transparent 6.5%),
  radial-gradient(circle at 20% 20%,#fff 0 5%,transparent 6%),radial-gradient(circle at 80% 20%,#fff 0 5%,transparent 6%),
  radial-gradient(circle at 20% 80%,#fff 0 5%,transparent 6%),radial-gradient(circle at 80% 80%,#fff 0 5%,transparent 6%),
  radial-gradient(circle at 38% 30%,#5cc77c,#0c9a3f 58%,#066628)}
.m6-ball--lg{width:clamp(30px,calc((100vw - 120px)/7),46px);height:clamp(30px,calc((100vw - 120px)/7),46px);font-size:clamp(13px,3.4vw,19px)}
.m6-ball--md{width:36px;height:36px;font-size:14px}
.m6-ball--sm{width:30px;height:30px;font-size:12px}

/* ----- section 1: latest result ----- */
.m6-result{padding:16px;margin:0 16px}
.m6-rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:14px}
.m6-rhead .draw{font-family:var(--font-display);font-weight:900;font-size:22px;color:var(--ink)}
.m6-rhead .date{font-size:12px;color:var(--ink-mute)}
.m6-snow{font-size:11px;font-weight:700;color:var(--gold-3);background:var(--ink);padding:2px 9px;border-radius:999px}
.m6-balls{display:flex;align-items:center;justify-content:center;gap:clamp(3px,1.3vw,7px);flex-wrap:nowrap;padding:6px 0 4px}
.m6-plus{font-family:var(--font-display);font-weight:700;font-size:clamp(15px,4vw,20px);color:var(--ink-mute);margin:0;flex-shrink:0}
.m6-balls-cap{font-size:10px;color:var(--ink-faint);margin:6px 0 14px}
.m6-prize{width:100%;border-collapse:collapse;margin-top:4px}
.m6-prize th,.m6-prize td{padding:7px 8px;font-size:12px;border-bottom:1px solid var(--rule);text-align:right}
.m6-prize th{font-size:10px;color:var(--ink-mute);font-weight:600;border-bottom:1px solid var(--rule-2)}
.m6-prize td:first-child,.m6-prize th:first-child{text-align:left;font-weight:700;color:var(--ink)}
.m6-prize .amt{font-family:var(--font-mono);font-weight:700;color:var(--green-2)}
.m6-prize .units{font-family:var(--font-mono);color:var(--ink-soft)}
.m6-prize tr.t1 td{background:var(--gold-tint)}
.m6-rfoot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.m6-stat{background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r-md);padding:10px 12px}
.m6-stat .k{font-size:10px;color:var(--ink-mute);margin-bottom:3px}
.m6-stat .v{font-family:var(--font-mono);font-weight:700;font-size:15px;color:var(--ink)}
.m6-stat .v small{font-family:var(--font-body);font-weight:400;font-size:10px;color:var(--ink-mute)}

/* ----- segmented controls ----- */
.m6-seg{display:flex;gap:2px;background:var(--paper-3);border-radius:var(--r-md);padding:3px;flex-wrap:wrap}
.m6-seg button{flex:1;min-width:54px;padding:7px 8px;font-size:12px;font-weight:600;color:var(--ink-mute);border-radius:6px;white-space:nowrap;transition:.12s}
.m6-seg button.active{background:var(--ink);color:var(--gold-3)}

/* ----- section 2: number stats ----- */
.m6-controls{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.m6-numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:7px}
.m6-cell{position:relative;border:1px solid var(--rule);border-radius:var(--r-md);padding:8px 5px 6px;text-align:center;background:var(--paper);overflow:hidden}
.m6-cell .heat{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.m6-cell .m6-ball{margin:0 auto 5px}
.m6-cell .row{display:flex;justify-content:space-between;font-size:9px;color:var(--ink-mute);padding:1px 3px;line-height:1.5}
.m6-cell .row b{font-family:var(--font-mono);font-weight:700;color:var(--ink)}
.m6-cell .row b.due{color:var(--red)}
.m6-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:10px;color:var(--ink-mute);margin-bottom:10px}
.m6-legend b{color:var(--ink)}

 /* ----- section 3: four-system research ledger ----- */
.m6-ledger{padding:16px;margin:0 16px;border-top:3px solid var(--gold)}
.m6-ledger-intro{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
.m6-ledger-intro p{margin:0;font-size:12px;line-height:1.7;color:var(--ink-soft);max-width:620px}
.m6-ledger-meta{font-family:var(--font-mono);font-size:10px;color:var(--ink-mute);text-align:right;white-space:nowrap}
.m6-origin{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--ink);background:var(--gold-tint);border:1px solid var(--gold);padding:4px 8px;border-radius:4px}
.m6-origin.retro{color:var(--red);background:var(--red-2);border-color:rgba(160,30,40,.25)}
.m6-rule{padding:11px 12px;margin:12px 0 16px;border-left:3px solid var(--gold);background:var(--paper-2);font-size:11px;line-height:1.7;color:var(--ink-soft)}
.m6-systemgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.m6-system{border:1px solid var(--rule);border-radius:var(--r-md);background:var(--paper);padding:12px;min-width:0;transition:transform .18s ease,box-shadow .18s ease}
.m6-system:hover{transform:translateY(-2px);box-shadow:var(--sh-sm)}
.m6-system h3{font-family:var(--font-display);font-size:14px;margin:0 0 9px;color:var(--ink)}
.m6-system .m6-balls{justify-content:flex-start;gap:5px;flex-wrap:wrap;padding:2px 0 11px}
.m6-system .m6-ball{width:29px;height:29px;font-size:11px}
.m6-system .m6-ball::before{left:23%;top:23%;width:54%;height:54%}
.m6-system-foot{border-top:1px solid var(--rule);padding-top:9px;display:grid;gap:5px;font-size:10px;color:var(--ink-mute)}
.m6-hit{display:flex;justify-content:space-between;gap:8px}
.m6-hit b{font-family:var(--font-mono);color:var(--ink)}
.m6-hit b.yes{color:var(--green-2)}
.m6-hit b.no{color:var(--ink-mute)}
.m6-result-strip{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 0;margin-bottom:10px}
.m6-result-strip .label{font-size:11px;color:var(--ink-mute);margin-right:3px}
.m6-result-strip .m6-ball{width:26px;height:26px;font-size:10px}
.m6-history{display:grid;gap:12px}
.m6-history-row{border:1px solid var(--rule);border-radius:var(--r-md);padding:13px;background:var(--paper)}
.m6-history-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.m6-history-head strong{font-family:var(--font-display);font-size:15px;color:var(--ink)}
.m6-history-head time{font-size:11px;color:var(--ink-mute)}
.m6-history-row .m6-systemgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
.m6-history-row .m6-system{padding:10px}
.m6-history-row .m6-system .m6-ball{width:25px;height:25px;font-size:10px}
.m6-more{display:block;margin:14px auto 0;padding:9px 16px;border:1px solid var(--gold);border-radius:999px;color:var(--ink);background:var(--gold-tint);font-size:11px;font-weight:800;transition:transform .16s ease,box-shadow .16s ease}
.m6-more:hover{transform:translateY(-1px);box-shadow:var(--sh-sm)}
.m6-empty{padding:24px 12px;text-align:center;background:var(--paper-2);border:1px dashed var(--rule-2);border-radius:var(--r-md);font-size:12px;color:var(--ink-mute);line-height:1.7}
.m6-fetcherr{color:var(--red);background:var(--red-2);border:1px solid rgba(160,30,40,.2)}
@media(max-width:760px){
  .m6-ledger-intro{display:block}.m6-ledger-meta{text-align:left;margin-top:8px}
  .m6-systemgrid,.m6-history-row .m6-systemgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:390px){.m6-systemgrid,.m6-history-row .m6-systemgrid{grid-template-columns:1fr}}
</style>
</head>
<body data-page="marksix">
<div class="shell">

<header class="brandbar" data-tx-shell="brandbar"></header>

<div class="ticker" id="m6-ticker">六合彩 · <span data-tx-loader data-size="sm" data-label="載入最新攪珠結果…"></span></div>

<section class="page-head">
  <h1><small>MARK SIX</small>六合彩</h1>
  <p>官方結果 · 號碼統計 · 四術獨立研究紀錄。<br><span class="pill pill--gold">資訊展示 · 非投注介面</span></p>
</section>

<!-- ===== Section 1 · latest result ===== -->
<section class="card m6-result" id="m6-result">
  <div class="m6-state" id="m6-result-state"><div class="tx-lemni-host" data-tx-loader data-label="載入中…"></div></div>
</section>

<!-- ===== Section 2 · number stats ===== -->
<section class="m6-sec">
  <h2 class="m6-h2">號碼統計 <small>NUMBER FREQUENCY</small></h2>
  <div class="m6-controls">
    <div class="m6-seg" id="m6-periods" role="tablist"></div>
    <div class="m6-seg" id="m6-sort" role="tablist"></div>
  </div>
  <div class="m6-legend">
    <span><b>開</b> 開出次數（所選期內）</span>
    <span><b>遺</b> 距今未開（全期數據）</span>

<section class="m6-sec">

  <div class="card m6-ledger" id="m6-ledger">
    <div class="m6-state"><div class="tx-lemni-host" data-tx-loader data-label="載入研究紀錄…"></div></div>
  </div>
</section>

  <strong>天喜為分析平台，不提供投注服務。</strong><br>

  Analysis platform · NO betting services · Data for research only

<script>
(function(){
  'use strict';
  var RAW = 'https://raw.githubusercontent.com/sleepingarhat/hk-mark-six-2002-now/main/data/';
  var LATEST_URL = RAW + 'latest.json';
  var HISTORY_URL = RAW + 'mark-six.json';

  // ---- official HKJC colour groups ----
  var RED = new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46]);
  var BLUE = new Set([3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48]);
  function grp(n){ return RED.has(n) ? 'red' : BLUE.has(n) ? 'blue' : 'green'; }
  function ball(n, size, special){
    return '<span class="m6-ball m6-ball--' + (size||'md') + ' ' + grp(n) + (special?' special':'') + '">' + n + '</span>';
  }
  var TIER = {1:'頭獎',2:'二獎',3:'三獎',4:'四獎',5:'五獎',6:'六獎',7:'七獎'};
  var WD = ['日','一','二','三','四','五','六'];
  function money(v){ if(v==null||v==='') return ''; var n=Number(v); return isNaN(n)?String(v):'$'+n.toLocaleString('en-US'); }
  function num(v){ var n=Number(v); return isNaN(n)?String(v):n.toLocaleString('en-US'); }
  function cnDate(iso){
    if(!iso) return '';
    var m = iso.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(!m) return iso;
    var d = new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));   // TZ-safe weekday
    return +m[1] + '年' + (+m[2]) + '月' + (+m[3]) + '日（' + WD[d.getUTCDay()] + '）';
  }
  // ================= state =================
  var HISTORY=[], LATEST=null, UNIT=10, LATEST_YEAR='';
  var STATS=null, PERIOD='100', SORT='num', LEDGER=null;
  var LEDGER_HISTORY_LIMIT=10;

  // ================= section 1 =================
  function renderResult(){
    var el=document.getElementById('m6-result');
    if(!LATEST){ el.innerHTML='<div class="m6-state err">未能載入攪珠結果。</div>'; return; }
    var d=LATEST;
    var ballsHTML='';
    d.numbers.forEach(function(n){ ballsHTML+=ball(n,'lg',false); });
    ballsHTML+='<span class="m6-plus">+</span>'+ball(d.special,'lg',true);

    var prizes=d.prizes||[];
    var showUnits=prizes.some(function(p){ return p.winningUnit!=null && p.winningUnit!==''; });
    var showDividend=prizes.some(function(p){ return p.dividend!=null && p.dividend!==''; });
    var rows='';
    prizes.forEach(function(p){
      rows+='<tr class="'+(p.tier===1?'t1':'')+'"><td>'+(TIER[p.tier]||('第'+p.tier))+'</td>'+
            (showUnits?'<td class="units">'+num(p.winningUnit)+'</td>':'')+
            (showDividend?'<td class="amt">'+money(p.dividend)+'</td>':'')+'</tr>';
    });

    var nd=d.nextDraw;
    var nextLine = nd && nd.date
      ? cnDate(nd.date) + (nd.estimatedPrize ? ' · 估計頭獎基金 ' + money(nd.estimatedPrize) : '')
      : '待 HKJC 公佈';

    el.innerHTML =
      '<div class="m6-rhead">'+
        '<span class="draw">第 '+d.draw+' 期</span>'+
        '<span class="date">'+cnDate(d.date)+'</span>'+
        (d.snowball?'<span class="m6-snow">'+d.snowball+'</span>':'')+
      '</div>'+
      '<div class="m6-balls">'+ballsHTML+'</div>'+
      '<div class="m6-balls-cap">攪珠結果 · 最後一個（＋）為特別號碼</div>'+
      (rows?'<table class="m6-prize"><thead><tr><th>獎級</th>'+(showUnits?'<th>中獎注數</th>':'')+(showDividend?'<th>每注獎金</th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table>':'')+
      '<div class="m6-rfoot">'+
        (d.totalInvestment!=null&&d.totalInvestment!==''?'<div class="m6-stat"><div class="k">總投注額</div><div class="v">'+money(d.totalInvestment)+'</div></div>':'')+
        '<div class="m6-stat"><div class="k">下期攪珠</div><div class="v" style="font-size:12px;line-height:1.4">'+nextLine+'</div></div>'+
      '</div>';

    // ticker
    var tk=document.getElementById('m6-ticker');
    tk.innerHTML='<strong>第 '+d.draw+' 期</strong> · '+d.numbers.join(' ')+' ＋'+d.special+' · '+cnDate(d.date)+(d.snowball?' · '+d.snowball:'');
  }

  // ================= section 2 — stats =================
  function computeStats(periodKey){
    var n;
    var win;
    if(periodKey==='ytd'){ win=HISTORY.filter(function(d){ return d.date.slice(0,4)===LATEST_YEAR; }); }
    else { n=parseInt(periodKey,10); win=HISTORY.slice(Math.max(0,HISTORY.length-n)); }
    var count={}, maxOm={}, curOm={};
    for(var i=1;i<=49;i++){ count[i]=0; maxOm[i]=0; }
    // count + max omission within window
    var run={}; for(var j=1;j<=49;j++) run[j]=0;
    win.forEach(function(d){
      var has={}; d.numbers.forEach(function(x){ has[x]=1; });
      for(var v=1;v<=49;v++){
        if(has[v]){ count[v]++; if(run[v]>maxOm[v]) maxOm[v]=run[v]; run[v]=0; }
        else { run[v]++; }
      }
    });
    for(var w=1;w<=49;w++){ if(run[w]>maxOm[w]) maxOm[w]=run[w]; }
    // current omission — GLOBAL (draws since last appearance across all history)
    for(var t=1;t<=49;t++) curOm[t]=HISTORY.length;
    for(var z=1;z<=49;z++){
      for(var k2=HISTORY.length-1, gap=0; k2>=0; k2--, gap++){
        if(HISTORY[k2].numbers.indexOf(z)!==-1){ curOm[z]=gap; break; }
      }
    }
    return { count:count, maxOm:maxOm, curOm:curOm, windowLen:win.length };
  }
  function renderStats(){
    STATS=computeStats(PERIOD);
    var s=STATS, grid=document.getElementById('m6-numgrid');
    var maxCount=0; for(var i=1;i<=49;i++){ if(s.count[i]>maxCount) maxCount=s.count[i]; }
    var order=[]; for(var n=1;n<=49;n++) order.push(n);
    if(SORT==='hot') order.sort(function(a,b){ return s.count[b]-s.count[a] || a-b; });
    else if(SORT==='due') order.sort(function(a,b){ return s.curOm[b]-s.curOm[a] || a-b; });
    var html='';
    order.forEach(function(n){
      var heat = maxCount? (s.count[n]/maxCount) : 0;
      html+='<div class="m6-cell">'+
        '<div class="heat" style="opacity:'+(0.15+heat*0.85).toFixed(2)+'"></div>'+
        ball(n,'sm',false)+
        '<div class="row"><span>開</span><b>'+s.count[n]+'</b></div>'+
        '<div class="row"><span>遺</span><b class="'+(s.curOm[n]>=10?'due':'')+'">'+s.curOm[n]+'</b></div>'+
        '<div class="row"><span>期</span><b>'+s.maxOm[n]+'</b></div>'+
      '</div>';
    });
    grid.innerHTML=html;
  }
  function buildSeg(id, items, getActive, onPick){
    var box=document.getElementById(id);
    box.innerHTML=items.map(function(it){
      return '<button data-v="'+it.v+'"'+(it.v===getActive()?' class="active"':'')+'>'+it.label+'</button>';
    }).join('');
    box.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){
        onPick(b.getAttribute('data-v'));
        box.querySelectorAll('button').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
      });
    });
  }

  // ================= section 3 — read-only research ledger =================
  function originTag(row){
    var retro=row.origin==='retrospective_reconstruction';
    return '<span class="m6-origin'+(retro?' retro':'')+'">'+(row.originLabel||'')+'</span>';
  }
  function resultStrip(result){
    if(!result) return '';
    return '<div class="m6-result-strip"><span class="label">實際結果</span>'+
      result.mainNumbers.map(function(n){return ball(n,'sm',false);}).join('')+
      '<span class="m6-plus">＋</span>'+ball(result.specialNumber,'sm',true)+'</div>';
  }
  function systemCard(sys, settled){
    if(!sys) return '';
    var mainHits=settled && Array.isArray(sys.mainHits)?sys.mainHits:[];
    return '<article class="m6-system"><h3>'+ (sys.name||'') +'</h3>'+
      '<div class="m6-balls">'+(sys.numbers||[]).map(function(n){
        return ball(n,'sm',settled && mainHits.indexOf(n)!==-1);
      }).join('')+'</div>'+
      (settled?'<div class="m6-system-foot">'+
        '<div class="m6-hit"><span>主號命中</span><b class="'+(sys.mainHitCount?'yes':'no')+'">'+
        (sys.mainHitCount||0)+' / 6'+(mainHits.length?'（'+mainHits.join('、')+'）':'')+'</b></div>'+
        '<div class="m6-hit"><span>特別號命中</span><b class="'+(sys.specialHit?'yes':'no')+'">'+(sys.specialHit?'是':'否')+'</b></div>'+
      '</div>':'')+'</article>';
  }
  function rowHTML(row, heading){
    if(!row) return '<div class="m6-empty">目前沒有可展示的紀錄。</div>';
    var settled=row.status==='settled' && row.result;
    var keys=['qimen','bazi','liuyao','taiyi'];
    return '<div class="m6-history-row">'+
      '<div class="m6-history-head"><strong>'+heading+' · '+(row.drawId||'')+'</strong>'+
      '<time>'+cnDate(row.date)+'</time>'+originTag(row)+'</div>'+
      (settled?resultStrip(row.result):'<p class="m6-note">尚未有官方結果；以下只展示凍結紀錄，不作事後比較。</p>')+
      '<div class="m6-systemgrid">'+keys.map(function(k){return systemCard(row.systems&&row.systems[k],settled);}).join('')+'</div></div>';
  }
  function renderLedger(){
    var el=document.getElementById('m6-ledger');
    if(!LEDGER){el.innerHTML='<div class="m6-empty m6-fetcherr">研究紀錄未能載入。頁面不會自行補算或產生號碼，請稍後重試。</div>';return;}
    var rule=LEDGER.rule||{}, current=LEDGER.current, latest=LEDGER.latestSettled;
    var history=LEDGER.history||[], visibleHistory=history.slice(0,LEDGER_HISTORY_LIMIT);
    var html='<div class="m6-ledger-intro"><p>四術各自保存七個號碼，按固定規則獨立記錄。這是研究簿，不是投注組合；不合併、不投票、不排名。</p>'+
      '<div class="m6-ledger-meta">更新 '+(LEDGER.updatedAtUtc||'')+'<br>時區 '+(LEDGER.timezone||'')+' · 截止 '+(LEDGER.cutoffHkt||'')+'</div></div>'+
      '<div class="m6-rule"><b>規則</b> '+(rule.summary||'')+'<br><b>缺段</b> '+(rule.missingBandFallback||'')+
      '<br><b>獨立性</b> '+(rule.independence||'')+'</div>'+
      '<h3 class="m6-h2">目前凍結紀錄 <small>BEFORE THE DRAW</small></h3>'+
      (current?rowHTML(current,'待開'):'<div class="m6-empty">目前沒有凍結中的四術紀錄。</div>')+
      '<h3 class="m6-h2" style="margin-top:22px">最近一次已結算 <small>SETTLED CHECK</small></h3>'+
      (latest?rowHTML(latest,'已結算'):'<div class="m6-empty">目前沒有已結算紀錄，暫不作命中比較。</div>')+
      '<h3 class="m6-h2" style="margin-top:22px">已結算歷史 <small>HISTORY</small></h3>'+
      (history.length?'<div class="m6-history">'+visibleHistory.map(function(r){return rowHTML(r,'歷史');}).join('')+'</div>'+
      (visibleHistory.length<history.length?'<button class="m6-more" id="m6-history-more">顯示更多（尚餘 '+(history.length-visibleHistory.length)+' 期）</button>':''):'<div class="m6-empty">目前沒有歷史紀錄。</div>');
    el.innerHTML=html;
    var more=document.getElementById('m6-history-more');
    if(more) more.addEventListener('click',function(){
      LEDGER_HISTORY_LIMIT+=10;
      renderLedger();
    });
  }

  // ================= boot =================
  function setupControls(){
    buildSeg('m6-periods', [
      {v:'10',label:'近10期'},{v:'50',label:'近50期'},{v:'100',label:'近100期'},{v:'500',label:'近500期'},{v:'ytd',label:'今年至今'}
    ], function(){return PERIOD;}, function(v){ PERIOD=v; renderStats(); });
    buildSeg('m6-sort', [
      {v:'num',label:'號碼'},{v:'hot',label:'最熱'},{v:'due',label:'最冷'}
    ], function(){return SORT;}, function(v){ SORT=v; renderStats(); });
  }

  function boot(){
    setupControls();
    Promise.all([
      fetch(LATEST_URL).then(function(r){ if(!r.ok) throw 0; return r.json(); }).catch(function(){ return null; }),
      fetch(HISTORY_URL).then(function(r){ if(!r.ok) throw 0; return r.json(); }).catch(function(){ return null; }),
      fetch('../data/marksix-four-systems-7.json').then(function(r){ if(!r.ok) throw 0; return r.json(); }).catch(function(){ return null; })
    ]).then(function(res){
      LATEST=res[0];
      HISTORY=(res[1]||[]).slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:(a.draw<b.draw?-1:1); });
      LEDGER=res[2];
      if(LATEST){ UNIT=Number(LATEST.unitBet)||10; }
      LATEST_YEAR = HISTORY.length ? HISTORY[HISTORY.length-1].date.slice(0,4) : String(new Date().getUTCFullYear());
      renderResult();
      if(HISTORY.length){ renderStats(); }
      else { document.getElementById('m6-numgrid').innerHTML='<div class="m6-state err">未能載入歷史攪珠數據。</div>'; }
      renderLedger();
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot, {once:true});
  else boot();
})();
</script>
</body>
</html>
