<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<script src="/assets/theme.js"></script>
<script src="/assets/shell.js" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDFBF5">
<title>六合彩 · 天喜 TIANXI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/shell.css">
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
<script src="./engine.js?v=fix-pq-20260827"></script>
<script src="./tianxi-mingpan.js"></script>
<style>
.m6-sec{padding:0 16px;margin-top:18px}
.m6-h2{font-family:var(--font-display);font-weight:900;font-size:16px;color:var(--ink);margin:0 0 10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.25}
.m6-h2 small{display:block;font-family:var(--font-mono);font-weight:500;font-size:10px;color:var(--ink-mute);letter-spacing:.08em}
.m6-note{font-size:11px;color:var(--ink-mute);line-height:1.6}
.m6-state{padding:24px 16px;text-align:center;color:var(--ink-mute);font-size:13px}
.m6-state.err{color:var(--red)}
.m6-ball{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-family:var(--font-mono);font-weight:800;color:#0d0d0d;line-height:1;flex-shrink:0;isolation:isolate;box-shadow:0 2px 4px rgba(0,0,0,.28)}
.hidden{display:none!important}
.qm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
</style>
</head>
<body data-page="marksix">
<div class="shell">
<header class="brandbar" data-tx-shell="brandbar"></header>
<div class="ticker" id="m6-ticker">六合彩 · 載入中…</div>
<section class="page-head">
  <h1><small>MARK SIX</small>六合彩</h1>
</section>
<section class="card m6-result" id="m6-result"><div class="m6-state">載入中…</div></section>
<section class="m6-sec">
  <div class="card m6-res">
    <div class="m6-next" id="nextDrawBox"></div>
    <div class="m6-ops">
      <div class="m6-field m6-dt" id="personalDTWrap">
        <input type="datetime-local" id="personalDT" autocomplete="off">
      </div>
      <div class="m6-sex-seg">
        <button type="button" class="m6-sex-btn" data-sex="m">男命</button>
        <button type="button" class="m6-sex-btn" data-sex="f">女命</button>
      </div>
      <div id="natalOut" class="hidden"></div>
      <button type="button" class="m6-mode-btn" id="btnSolo" data-mode="solo">獨測</button>
      <button type="button" class="m6-mode-btn" id="btnBazi" data-mode="bazi">八字合盤</button>
      <button type="button" class="m6-mode-btn" id="btnQimen" data-mode="qimen">奇門合盤</button>
      <button type="button" class="m6-bt-btn" data-bt="pure_bazi">八字獨測</button>
      <button type="button" class="m6-bt-btn" data-bt="pure_qimen">奇門獨測</button>
      <button type="button" class="m6-bt-btn" data-bt="bazi">八字合盤</button>
      <button type="button" class="m6-bt-btn" data-bt="qimen">奇門合盤</button>
    </div>
    <p class="m6-note" id="status"></p>
    <div id="panel-solo" class="hidden"><div id="soloOut"></div></div>
    <div id="panel-bazi" class="hidden"><div id="baziOut"></div></div>
    <div id="panel-qimen" class="hidden"><div id="qimenOut"></div></div>
    <div id="panel-bt" class="hidden">
      <div id="btModeLabel">回測</div>
      <div id="btStats"></div>
      <table class="m6-table" id="btTable"><thead><tr><th>期次</th><th>預測15碼</th><th>官方結果</th><th>命中</th><th>獎級</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</section>
<footer class="disclaimer">天喜為分析平台，不提供投注服務。</footer>
<nav class="botnav" data-tx-shell="botnav"></nav>
</div>
<script src="./site-app.js?v=fix-pq-20260827"></script>
<script src="./natal-ui.js"></script>
</body>
</html>
