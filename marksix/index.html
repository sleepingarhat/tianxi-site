<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<script src="/assets/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDFBF5">
<title>六合彩 · 天喜</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
:root{--paper:#FDFBF5;--paper-2:#F7F4EB;--ink:#1A1A1A;--ink-mute:#6B6B6B;--rule:#E8E4D9;--gold:#C9A227;--gold-2:#B8860B;--gold-3:#F5E6B8;--gold-tint:rgba(201,162,39,.12);--green-2:#2E7D32;--red:#C62828;--r-md:10px;--font-display:'Noto Serif TC',serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace}
.m6-wrap{max-width:720px;margin:0 auto;padding:0 0 88px}
.m6-h2{font-family:var(--font-display);font-weight:900;font-size:16px;color:var(--ink);margin:0 0 10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.25}
.m6-h2 small{font-size:11px;font-weight:600;color:var(--ink-mute);letter-spacing:.04em}
.m6-ball{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:800;position:relative;z-index:0;color:#111;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.m6-ball::before{content:"";position:absolute;left:23%;top:23%;width:54%;height:54%;border-radius:50%;background:radial-gradient(circle at 42% 36%,#fff,#e9ecee 88%);box-shadow:0 0 0 1px rgba(0,0,0,.06) inset,0 1px 2px rgba(0,0,0,.20);z-index:-1}
.m6-ball.red{background:linear-gradient(160deg,#ff6b6b,#e03131)}.m6-ball.blue{background:linear-gradient(160deg,#74c0fc,#1c7ed6)}.m6-ball.green{background:linear-gradient(160deg,#8ce99a,#2f9e44)}
.m6-ball.special{box-shadow:0 0 0 2px var(--gold)}
.m6-ball.hit{animation:m6hit 1.2s ease-in-out infinite;box-shadow:0 0 0 2px #ff6b00,0 0 12px rgba(255,107,0,.55)}
@keyframes m6hit{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.m6-ball--lg{width:clamp(30px,calc((100vw - 120px)/7),46px);height:clamp(30px,calc((100vw - 120px)/7),46px);font-size:clamp(13px,3.4vw,19px)}
.m6-ball--md{width:36px;height:36px;font-size:14px}
.m6-ball--sm{width:30px;height:30px;font-size:12px}
.m6-plus{margin:0 4px;font-weight:800;color:var(--ink-mute)}
.m6-balls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.m6-balls-cap{font-size:11px;color:var(--ink-mute);margin-bottom:8px}
.m6-rhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:6px}
.m6-rhead .draw{font-weight:800;font-size:16px}.m6-rhead .date{color:var(--ink-mute);font-size:13px}
.m6-snow{background:var(--gold-tint);color:var(--gold-2);font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.m6-prize{width:100%;border-collapse:collapse;margin-top:4px}
.m6-prize th,.m6-prize td{padding:7px 8px;font-size:12px;border-bottom:1px solid var(--rule);text-align:right}
.m6-prize th{font-size:10px;color:var(--ink-mute);font-weight:600}
.m6-prize td:first-child,.m6-prize th:first-child{text-align:left;font-weight:700}
.m6-prize .amt{font-family:var(--font-mono);font-weight:700}
.m6-prize tr.t1 td{background:var(--gold-tint)}
.m6-rfoot{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.m6-stat .k{font-size:10px;color:var(--ink-mute)}.m6-stat .v{font-weight:800;font-size:14px}
.m6-seg{display:flex;gap:4px;background:var(--paper-2);padding:3px;border-radius:8px;margin:8px 0;flex-wrap:wrap}
.m6-seg button{flex:1;min-width:54px;padding:7px 8px;font-size:12px;font-weight:600;color:var(--ink-mute);border-radius:6px;border:0;background:transparent;cursor:pointer}
.m6-seg button.active{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.m6-numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:8px}
.m6-cell{position:relative;border:1px solid var(--rule);border-radius:var(--r-md);padding:8px 5px 6px;text-align:center;background:var(--paper);overflow:hidden}
.m6-cell .heat{position:absolute;left:0;bottom:0;width:100%;background:var(--gold);opacity:.15;pointer-events:none}
.m6-cell .row{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-mute);margin-top:2px}
.m6-cell .row b{color:var(--ink)}.m6-cell .row b.due{color:var(--red)}
.m6-ticker{font-size:12px;color:var(--ink-mute);padding:8px 16px;border-bottom:1px solid var(--rule)}
.m6-res{padding:16px;margin:0 16px;border-top:3px solid var(--gold);overflow:hidden}
.m6-field{width:100%;max-width:100%;box-sizing:border-box;overflow:hidden}
.m6-field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--ink)}
.m6-res input{display:block;width:100%;max-width:100%;min-width:0;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;font-size:14px;margin-bottom:10px;background:var(--paper);color:var(--ink);box-sizing:border-box;-webkit-appearance:none;appearance:none}
.m6-btn{background:var(--ink);color:var(--gold-3);border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:13px}
.m6-btn.sec{background:var(--paper-2);color:var(--ink);border:1px solid var(--rule)}
.m6-btn.active{outline:2px solid var(--gold);outline-offset:1px}
.m6-meta{font-size:12px;color:var(--ink-mute);white-space:pre-wrap;background:var(--paper-2);border-left:3px solid var(--gold);padding:8px 10px;margin:8px 0;border-radius:0 8px 8px 0}
.m6-table{width:100%;border-collapse:collapse;font-size:11px;table-layout:auto}
.m6-table th{white-space:nowrap;font-size:10px;color:var(--ink-mute);font-weight:600;padding:8px 4px;border-bottom:1px solid var(--rule);text-align:left;background:var(--paper);position:sticky;top:0;z-index:1}
.m6-table td{border-bottom:1px solid var(--rule);padding:10px 4px;text-align:left;vertical-align:top}
.m6-table .col-meta{width:4.6em;white-space:nowrap}
.m6-table .col-prize{width:5.2em;white-space:nowrap}
.m6-draw-cell{display:flex;flex-direction:column;gap:1px;line-height:1.25}
.m6-draw-cell .d{font-size:11px;font-weight:700;color:var(--ink);letter-spacing:-0.02em}
.m6-draw-cell .p{font-size:10px;color:var(--ink-mute);font-family:var(--font-mono)}
.m6-score{font-weight:700;font-size:11px;line-height:1.3;white-space:nowrap}.m6-score.hi{color:var(--green-2)}
.m6-nums-mini{display:flex;flex-wrap:wrap;gap:3px;max-width:9.5rem}
.m6-bt-scroll{overflow:auto;max-height:480px;margin-top:12px;-webkit-overflow-scrolling:touch}
.m6-block{margin:12px 0}.m6-block-title{font-weight:800;font-size:13px;margin:8px 0 4px}
.m6-note{font-size:11px;color:var(--ink-mute)}
.m6-state{padding:16px;color:var(--ink-mute)}.m6-state.err{color:var(--red)}
.m6-controls{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.m6-mode-row{display:flex;flex-wrap:wrap;gap:8px}
.m6-next-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.m6-next-k{font-size:10px;color:var(--ink-mute);font-weight:600}.m6-next-v{font-weight:700;font-size:14px}
.m6-next-draw{font-size:18px;font-family:var(--font-mono)}
.m6-next-pillars{margin-top:8px}
@media(max-width:600px){.m6-next-grid{grid-template-columns:1fr}}
.m6-statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.m6-statbox{background:var(--paper-2);border-radius:10px;padding:10px 12px}
.m6-statbox .k{font-size:10px;color:var(--ink-mute)}.m6-statbox .v{font-size:20px;font-weight:800;margin-top:2px}
.hidden{display:none!important}
.m6-bt-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:8px 0 12px}
.m6-bt-btn{font-size:12px;padding:9px 12px;line-height:1.3;text-align:center}
.m6-nums-mini .m6-ball{width:22px;height:22px;font-size:10px}
.bz-wrap{margin:8px 0 12px}
.bz-title{font-size:12px;margin-bottom:6px;color:var(--ink)}
.bz-chart{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--paper-2);border:1px solid var(--rule);border-radius:12px;padding:10px 6px;text-align:center}
.bz-col{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.bz-lab{font-size:10px;color:var(--ink-mute);font-weight:600}
.bz-stem{font-size:22px;font-weight:900;line-height:1.1;position:relative}
.bz-zhi{font-size:18px;font-weight:800;line-height:1.1}
.bz-shen{display:block;font-size:9px;font-weight:600;font-style:normal;opacity:.75;margin-top:1px}
.bz-cang{display:flex;flex-direction:column;gap:1px;margin-top:6px;font-size:12px;font-weight:700}
.bz-cang-item{line-height:1.2}
.bz-cang-item .bz-shen{display:inline;margin-left:2px;font-size:9px}
.wx-mu{color:#2E7D32}.wx-huo{color:#C62828}.wx-tu{color:#8D6E63}.wx-jin{color:#F9A825}.wx-shui{color:#1565C0}
#status{font-size:12px;color:var(--ink-mute);padding:4px 16px 8px}
</style>
</head>
<body>
<div id="brandbar"></div>
<div class="m6-wrap">
  <div class="m6-ticker" id="m6-ticker">載入中…</div>
  <div class="m6-res" id="m6-result"><div class="m6-state">載入最新攪珠…</div></div>
  <div class="m6-res">
    <h2 class="m6-h2">號碼統計</h2>
    <div id="m6-periods" class="m6-seg"></div>
    <div id="m6-sort" class="m6-seg"></div>
    <div id="m6-numgrid" class="m6-numgrid"></div>
  </div>
  <div class="m6-res">
    <p>官方結果 · 號碼統計 · 八字及奇門遁甲系統。<br><span class="pill pill--gold">資訊展示 · 非投注介面</span></p>
    <h2 class="m6-h2">八字及奇門遁甲系統 <small>BAZI · QIMEN DUNJIA System</small></h2>
    <div id="nextDrawBox"><div class="m6-state">載入下一期資料中…</div></div>
    <div class="m6-field">
      <label for="personalDT">輸入個人出生資料</label>
      <input type="datetime-local" id="personalDT" step="60">
    </div>
    <div class="m6-mode-row">
      <button type="button" class="m6-btn m6-mode-btn" id="btnSolo" data-mode="solo">八字與奇門獨測</button>
      <button type="button" class="m6-btn m6-mode-btn" id="btnBazi" data-mode="bazi">八字合盤</button>
      <button type="button" class="m6-btn m6-mode-btn" id="btnQimen" data-mode="qimen">奇門合盤</button>
    </div>
    <div id="status"></div>
    <div id="panel-solo" class="hidden"><div id="soloOut"></div></div>
    <div id="panel-bazi" class="hidden"><div id="baziOut"></div></div>
    <div id="panel-qimen" class="hidden"><div id="qimenOut"></div></div>
    <div class="m6-bt-bar">
      <button type="button" class="m6-btn sec m6-bt-btn" data-bt="pure_bazi">最近100期八字獨測回測數據</button>
      <button type="button" class="m6-btn sec m6-bt-btn" data-bt="pure_qimen">最近100期奇門獨測回測數據</button>
      <button type="button" class="m6-btn sec m6-bt-btn" data-bt="bazi">最近100期八字合盤回測數據</button>
      <button type="button" class="m6-btn sec m6-bt-btn" data-bt="qimen">最近100期奇門合盤回測數據</button>
    </div>
    <div id="panel-bt" class="hidden">
      <div class="m6-block-title" id="btModeLabel">回測</div>
      <div id="btStats"></div>
      <div class="m6-bt-scroll">
        <table class="m6-table" id="btTable"><thead><tr><th class="col-meta">期次</th><th>預測15碼</th><th>官方結果</th><th>命中</th><th class="col-prize">獎級</th></tr></thead><tbody></tbody></table>
      </div>
      <div class="m6-note" style="margin-top:8px">規則：bazi + qimen-chaibu-v3 (blog/407起局 + 719/28/31取數) · 個人奇門＝出生時起時家奇門終身參考盤 · 特碼命中計 0.5 字</div>
      <div class="m6-note" id="ruleVer"></div>
    </div>
  </div>
</div>
<div id="botnav"></div>
<script src="/assets/site-app.js"></script>
<script src="/marksix/engine.js"></script>
<script src="/marksix/site-app.js"></script>
</body>
</html>
